<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Baganto Project Roadmap - Interactive Checklist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .progress-bar {
            margin-top: 20px;
            background: rgba(255,255,255,0.3);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #4ade80;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .controls {
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid #e0e0e0;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .content {
            padding: 30px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .phase {
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
            padding-left: 20px;
        }

        .phase.completed {
            border-left-color: #4ade80;
            opacity: 0.7;
        }

        .phase-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
            user-select: none;
        }

        .phase-toggle {
            margin-right: 10px;
            font-size: 18px;
        }

        .phase-title {
            flex: 1;
        }

        .phase-title h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 2px;
        }

        .phase-title p {
            font-size: 12px;
            color: #666;
        }

        .phase-count {
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .phase-count.completed {
            background: #4ade80;
        }

        .phase-items {
            display: none;
            margin-top: 15px;
        }

        .phase-items.show {
            display: block;
        }

        .item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .item:hover {
            background: #f0f1f3;
        }

        .item.done {
            background: #f0fdf4;
        }

        .item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: #667eea;
            flex-shrink: 0;
        }

        .item input[type="checkbox"]:checked {
            accent-color: #4ade80;
        }

        .item-label {
            flex: 1;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            word-break: break-word;
            line-height: 1.4;
        }

        .item.done .item-label {
            color: #999;
            text-decoration: line-through;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }

        .status-done {
            background: #d1fae5;
            color: #065f46;
        }

        .status-pending {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-progress {
            background: #fef3c7;
            color: #92400e;
        }

        .footer {
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            font-size: 12px;
            color: #666;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 800;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        @media print {
            body {
                background: white;
            }
            .controls {
                display: none;
            }
            .content {
                max-height: none;
                overflow: visible;
            }
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 24px;
            }
            .content {
                padding: 15px;
            }
            .phase {
                padding-left: 15px;
            }
        }
    </style>
</head>

        let allItems = [];
        let completedItems = [];

        function initializeData() {
            // Load completed items from localStorage
            const saved = localStorage.getItem('baganto_roadmap_completed');
            if (saved) {
                completedItems = JSON.parse(saved);
            }

            // Create flat list of all items
            allItems = [];
            Object.keys(PHASES).forEach(key => {
                PHASES[key].items.forEach((item, index) => {
                    allItems.push({
                        id: `${key}_${index}`,
                        phase: key,
                        text: item
                    });
                });
            });
        }

        function renderContent() {
            const content = document.getElementById('content');
            content.innerHTML = '';

            Object.keys(PHASES).forEach(key => {
                const phase = PHASES[key];
                const phaseItems = phase.items;
                const phaseId = `phase_${key}`;

                const phaseCompleted = phaseItems.filter((_, idx) =>
                    completedItems.includes(`${key}_${idx}`)
                ).length;

                const phaseEl = document.createElement('div');
                phaseEl.className = `phase ${phaseCompleted === phaseItems.length ? 'completed' : ''}`;

                const headerEl = document.createElement('div');
                headerEl.className = 'phase-header';
                headerEl.onclick = () => togglePhase(phaseId);

                const toggleEl = document.createElement('div');
                toggleEl.className = 'phase-toggle';
                toggleEl.textContent = document.getElementById(`${phaseId}_items`)?.classList.contains('show') ? '▼' : '▶';

                const titleEl = document.createElement('div');
                titleEl.className = 'phase-title';
                titleEl.innerHTML = `
                    <h2>${phase.title}</h2>
                    ${phase.subtitle ? `<p>${phase.subtitle}</p>` : ''}
                `;

                const countEl = document.createElement('div');
                countEl.className = `phase-count ${phaseCompleted === phaseItems.length ? 'completed' : ''}`;
                countEl.textContent = `${phaseCompleted}/${phaseItems.length}`;

                headerEl.appendChild(toggleEl);
                headerEl.appendChild(titleEl);
                headerEl.appendChild(countEl);

                const itemsContainerEl = document.createElement('div');
                itemsContainerEl.id = `${phaseId}_items`;
                itemsContainerEl.className = 'phase-items';

                phaseItems.forEach((item, idx) => {
                    const itemId = `${key}_${idx}`;
                    const isCompleted = completedItems.includes(itemId);

                    const itemEl = document.createElement('div');
                    itemEl.className = `item ${isCompleted ? 'done' : ''}`;

                    const checkboxEl = document.createElement('input');
                    checkboxEl.type = 'checkbox';
                    checkboxEl.id = itemId;
                    checkboxEl.checked = isCompleted;
                    checkboxEl.onchange = () => toggleItem(itemId);

                    const labelEl = document.createElement('label');
                    labelEl.className = 'item-label';
                    labelEl.htmlFor = itemId;
                    labelEl.textContent = item;

                    itemEl.appendChild(checkboxEl);
                    itemEl.appendChild(labelEl);
                    itemsContainerEl.appendChild(itemEl);
                });

                phaseEl.appendChild(headerEl);
                phaseEl.appendChild(itemsContainerEl);
                content.appendChild(phaseEl);
            });

            updateStats();
        }

        function togglePhase(phaseId) {
            const items = document.getElementById(`${phaseId}_items`);
            items.classList.toggle('show');
        }

        function toggleItem(itemId) {
            const index = completedItems.indexOf(itemId);
            if (index > -1) {
                completedItems.splice(index, 1);
            } else {
                completedItems.push(itemId);
            }
            saveProgress();
            renderContent();
        }

        function saveProgress() {
            localStorage.setItem('baganto_roadmap_completed', JSON.stringify(completedItems));
        }

        function updateStats() {
            const total = allItems.length;
            const completed = completedItems.length;
            const pending = total - completed;
            const percentage = Math.round((completed / total) * 100);

            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('statCompleted').textContent = completed;
            document.getElementById('statPending').textContent = pending;
            document.getElementById('statPercentage').textContent = percentage + '%';

            // Count completed phases
            let completedPhases = 0;
            Object.keys(PHASES).forEach(key => {
                const phase = PHASES[key];
                const phaseItems = phase.items;
                const phaseCompleted = phaseItems.filter((_, idx) =>
                    completedItems.includes(`${key}_${idx}`)
                ).length;
                if (phaseCompleted === phaseItems.length) {
                    completedPhases++;
                }
            });
            document.getElementById('statPhases').textContent = completedPhases;

            // Update progress bar
            const progressFill = document.getElementById('progressFill');
            progressFill.style.width = percentage + '%';
        }

        function expandAll() {
            Object.keys(PHASES).forEach(key => {
                document.getElementById(`phase_${key}_items`).classList.add('show');
            });
        }

        function collapseAll() {
            Object.keys(PHASES).forEach(key => {
                document.getElementById(`phase_${key}_items`).classList.remove('show');
            });
        }

        function markAllCompleted() {
            if (confirm('Mark ALL items as completed?')) {
                completedItems = allItems.map(item => item.id);
                saveProgress();
                renderContent();
            }
        }

        function clearAllCompleted() {
            if (confirm('Clear ALL completed items?')) {
                completedItems = [];
                saveProgress();
                renderContent();
            }
        }

        function exportProgress() {
            const completed = completedItems.length;
            const total = allItems.length;
            const percentage = Math.round((completed / total) * 100);

            const text = `
BAGANTO PROJECT PROGRESS REPORT
================================
Date: ${new Date().toLocaleString()}

SUMMARY:
- Completed: ${completed} / ${total} items
- Progress: ${percentage}%
- Completed Phases: ${Object.keys(PHASES).filter(key => {
                const phase = PHASES[key];
                const phaseCompleted = phase.items.filter((_, idx) =>
                    completedItems.includes(`${key}_${idx}`)
                ).length;
                return phaseCompleted === phase.items.length;
            }).length} / ${Object.keys(PHASES).length}

DETAILS:
${Object.keys(PHASES).map(key => {
                const phase = PHASES[key];
                const phaseCompleted = phase.items.filter((_, idx) =>
                    completedItems.includes(`${key}_${idx}`)
                ).length;
                return `
${phase.title}
${phase.subtitle ? phase.subtitle : ''}
Status: ${phaseCompleted}/${phase.items.length} (${Math.round((phaseCompleted/phase.items.length)*100)}%)
                `;
            }).join('\n')}
            `;

            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `baganto_progress_${new Date().toISOString().split('T')[0]}.txt`;
            a.click();
        }

        // Initialize
        initializeData();
        renderContent();
    </script>
</body>
</html>
