<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baganto — Sell. Exchange. Save.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4f0;
    --surface:#ffffff;
    --ink:#1f2937;
    --muted:#6b7280;
    --border:#e6e1d8;
    --primary:#f97316;
    --primary-dark:#c2500a;
    --primary-light:#fff7ed;
    --accent:#f97316;
    --accent-dark:#ea580c;
    --danger:#dc2626;
    --danger-light:#fdecec;
    --success:#15803d;
    --success-light:#e8f6ec;
    --pending:#b45309;
    --pending-light:#fdf3e3;
    --sale:#4338ca;
    --sale-light:#eef2ff;
    --barter:#16a34a;
    --barter-light:#f0fdf4;
    --radius:14px;
    --shadow:0 1px 2px rgba(31,41,55,.06), 0 4px 14px rgba(31,41,55,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  a{color:var(--primary);}

  /* ---------- Nav ---------- */
  .nav{
    position:sticky;top:0;z-index:40;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:12px;
    padding:10px 18px;
    flex-wrap:wrap;
  }
  .nav-logo{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0;}
  .nav-logo-icon-wrap{width:46px;height:46px;background:#1a1a2e;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
  .nav-logo-icon-wrap img{width:42px;height:42px;object-fit:contain;display:block;}
  .nav-logo-words{display:flex;flex-direction:column;justify-content:center;gap:1px;}
  .nav-logo-words .w1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;color:var(--ink);line-height:1.1;letter-spacing:.2px;}
  .nav-logo-words .w1 .ob{color:var(--primary);}
  .nav-logo-words .w2{font-size:9px;font-weight:700;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase;line-height:1;}
  .sync-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;}
  .sync-pill.sync-on{background:var(--success-light);color:var(--success);}
  .sync-pill.sync-off{background:var(--pending-light);color:var(--pending);}
  .sync-pill.sync-wait{background:var(--border);color:var(--muted);}
  .nav-tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap;}
  .nav-tab{
    position:relative;
    padding:8px 11px;border-radius:9px;border:none;background:transparent;
    color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;
  }
  .nav-tab:hover{background:var(--primary-light);color:var(--primary-dark);}
  .nav-tab.active{background:var(--primary);color:#fff;}
  .nav-badge{
    position:absolute;top:1px;right:1px;background:var(--danger);color:#fff;
    font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;line-height:1.3;
  }
  /* ---------- Notifications ---------- */
  .notif-wrap{position:relative;flex-shrink:0;}
  .notif-bell{position:relative;background:transparent;border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:16px;line-height:1;margin-right:6px;}
  .notif-bell:hover{border-color:var(--primary);background:var(--primary-light);}
  .notif-count{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;line-height:1.3;}
  .notif-panel{position:absolute;top:calc(100% + 8px);right:0;width:330px;max-width:88vw;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 28px rgba(31,41,55,.16);z-index:60;overflow:hidden;}
  .notif-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);font-size:14px;}
  .notif-list{max-height:340px;overflow-y:auto;}
  .notif-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item:hover{background:var(--bg);}
  .notif-item.unread{background:var(--primary-light);}
  .notif-ico{font-size:16px;line-height:1.2;flex-shrink:0;}
  .notif-text{color:var(--ink);line-height:1.4;}
  .notif-time{font-size:11px;color:var(--muted);}
  .notif-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8;}

  .nav-user{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
  .nav-user select{padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--ink);font-weight:600;}

  .wrap{max-width:1080px;margin:0 auto;padding:22px;}

  /* ---------- Buttons ---------- */
  .btn{border:1px solid var(--border);background:#fff;color:var(--ink);padding:9px 16px;border-radius:9px;font-weight:600;font-size:14px;transition:transform .05s;}
  .btn:hover{border-color:var(--primary);color:var(--primary-dark);}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff;}
  .btn-danger{background:#fff;border-color:var(--danger);color:var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--muted);}
  .btn-ghost:hover{background:var(--bg);color:var(--ink);}

  /* ---------- Cards / Layout ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
  .section-title{font-family:'Baloo 2','Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;font-size:21px;font-weight:800;color:var(--primary-dark);margin:0 0 4px;}
  .section-sub{color:var(--muted);font-size:13.5px;margin:0 0 18px;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .toolbar input[type=text]{flex:1;min-width:180px;padding:10px 12px;border-radius:9px;border:1px solid var(--border);}
  .toolbar select{padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:#fff;}
  .toolbar label.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:0 4px;white-space:nowrap;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
  .item-card{padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;}
  .item-card:hover{border-color:var(--primary);}
  .item-icon{font-size:34px;line-height:1;}
  .item-title{font-weight:700;font-size:15.5px;}
  .item-meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .item-want{font-size:13px;color:var(--ink);background:var(--bg);border-radius:7px;padding:6px 9px;}
  .item-price{font-size:18px;font-weight:800;color:var(--primary-dark);}
  .item-owner{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:6px;border-top:1px solid var(--border);}

  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;}
  .pill-cat{background:var(--primary-light);color:var(--primary-dark);}
  .pill-cond{background:#eef2ff;color:#4338ca;}
  .per-month{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px;}
  .no-trade-note{background:var(--primary-light);border-left:3px solid var(--primary);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--primary-dark);line-height:1.5;}
  .pill-available{background:var(--success-light);color:var(--success);}
  .pill-pending{background:var(--pending-light);color:var(--pending);}
  .pill-traded{background:#eee;color:#777;}
  .pill-sold{background:#eee;color:#777;}
  .pill-sale{background:var(--sale-light);color:var(--sale);}
  .pill-barter{background:var(--barter-light);color:var(--barter);}
  .pill-accepted{background:#e3edfd;color:#1d4ed8;}
  .pill-completed{background:var(--success-light);color:var(--success);}
  .pill-rejected{background:var(--danger-light);color:var(--danger);}
  .pill-withdrawn{background:#eee;color:#777;}

  .trust-badge{display:inline-block;font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px;background:#e0f2fe;color:#0369a1;margin-right:4px;margin-bottom:4px;}

  .stars{color:var(--accent);letter-spacing:1px;}
  .empty{padding:46px 20px;text-align:center;color:var(--muted);}
  .empty-icon{font-size:38px;margin-bottom:10px;}

  /* ---------- Forms ---------- */
  .form-row{margin-bottom:14px;}
  .form-row label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:var(--ink);}
  .form-row input,.form-row select,.form-row textarea{
    width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:#fff;color:var(--ink);
  }
  .form-row textarea{resize:vertical;min-height:64px;}
  .form-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:560px){.form-2col{grid-template-columns:1fr;}}
  .mode-toggles{display:flex;gap:18px;flex-wrap:wrap;}
  .mode-toggles label{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,20,18,.5);
    display:flex;align-items:center;justify-content:center;padding:18px;z-index:100;
  }
  .modal-box{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 18px 50px rgba(0,0,0,.25);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);}
  .modal-head h3{margin:0;font-size:17px;}
  .modal-body{padding:20px;}
  .modal-close{border:none;background:transparent;font-size:20px;color:var(--muted);padding:4px 8px;border-radius:8px;}
  .modal-close:hover{background:var(--bg);}

  /* ---------- Trade card ---------- */
  .trade-card{padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;}
  .trade-card:hover{border-color:var(--primary);}
  .trade-swap{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;}
  .trade-swap .arrow{color:var(--muted);font-weight:400;}
  .trade-row-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .trade-msg-preview{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- Chat ---------- */
  .chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-bottom:none;border-radius:12px 12px 0 0;}
  .chat-head-av{width:34px;height:34px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .chat-head-name{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chat-head-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chat-thread{background:#f3ede5;border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;padding:12px 14px;}
  .chat-box{display:flex;flex-direction:column;gap:0;max-height:320px;overflow-y:auto;padding:2px 2px 6px;margin-bottom:10px;}
  .chat-day{align-self:center;font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:3px 12px;border-radius:99px;margin:8px 0 10px;}
  .chat-box .chat-day:first-child{margin-top:0;}
  .msg{max-width:76%;padding:7px 10px 5px;font-size:13.5px;line-height:1.42;position:relative;word-wrap:break-word;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(0,0,0,.06);margin-bottom:8px;}
  .msg.grouped{margin-bottom:3px;}
  .msg-me{align-self:flex-end;background:#ffe8d6;color:var(--ink);border-radius:12px 12px 3px 12px;}
  .msg-me.grouped{border-radius:12px 3px 3px 12px;}
  .msg-them{align-self:flex-start;background:var(--surface);color:var(--ink);border-radius:12px 12px 12px 3px;}
  .msg-them.grouped{border-radius:3px 12px 12px 3px;}
  .msg-time{font-size:10px;margin-left:8px;margin-top:5px;float:right;white-space:nowrap;color:var(--muted);}
  .msg-me .msg-time{color:#8a5a2b;}
  .msg-tick{margin-left:3px;font-size:10px;}
  .msg-tick.seen{color:#1d9bf0;}
  .chat-typing{align-self:flex-start;font-size:12px;color:var(--muted);font-style:italic;margin:2px 0 6px 4px;}
  .chat-input-row{display:flex;gap:8px;align-items:center;}
  .chat-input-row input[type="text"]{flex:1;height:38px;border-radius:99px;padding:0 14px;border:1px solid var(--border);background:var(--surface);font-size:13.5px;}
  .chat-input-row input[type="text"]:focus{outline:none;border-color:var(--primary);}
  .chat-send{width:38px;height:38px;flex-shrink:0;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .chat-send:hover{filter:brightness(.94);}
  .msg-img{display:block;max-width:190px;width:100%;border-radius:10px;margin-bottom:4px;cursor:pointer;background:var(--bg);}
  .msg-img+.msg-img{margin-top:4px;}
  .chat-attach{display:flex;align-items:center;justify-content:center;width:38px;height:38px;flex-shrink:0;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:17px;line-height:1;}
  .chat-attach:hover{border-color:var(--primary);background:var(--primary-light);}
  .chat-attach input{display:none;}
  .attach-wide{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px dashed var(--border);background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);}
  .attach-wide:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);}
  .attach-wide input{display:none;}
  .chat-img-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .chat-img-strip:empty{display:none;margin:0;}
  .chat-img-thumb{position:relative;width:58px;height:58px;}
  .chat-img-thumb img{width:58px;height:58px;object-fit:cover;border-radius:9px;border:1px solid var(--border);}
  .chat-img-x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:#ef4444;color:#fff;font-size:12px;line-height:1;cursor:pointer;padding:0;}

  /* ---------- Profile ---------- */
  .profile-head{display:flex;gap:16px;align-items:center;padding:22px;}
  .profile-avatar{font-size:48px;background:var(--primary-light);border-radius:16px;width:78px;height:78px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
  .avatar-upload-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap;}
  .avatar-upload-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);}
  .avatar-upload-btn input{display:none;}
  .stat-row{display:flex;gap:22px;margin-top:8px;flex-wrap:wrap;}
  .stat{font-size:13px;color:var(--muted);}
  .stat b{color:var(--ink);font-size:16px;display:block;}
  .review-card{padding:14px 16px;margin-bottom:10px;}
  .review-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}

  .star-picker{display:flex;gap:6px;font-size:30px;margin:6px 0 4px;}
  .star-picker span{cursor:pointer;color:#d8d4cc;}
  .star-picker span.on{color:var(--accent);}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:200;
  }
  .icon-grid{display:flex;flex-wrap:wrap;gap:6px;}
  .icon-opt{font-size:20px;padding:6px 9px;border-radius:8px;border:1px solid var(--border);background:#fff;}
  .icon-opt.sel{border-color:var(--primary);background:var(--primary-light);}
  .muted{color:var(--muted);}
  .footer-note{text-align:center;color:var(--muted);font-size:12px;margin:30px 0 10px;}
  .footer-links{display:inline-block;margin-top:6px;}
  .footer-link{background:none;border:none;color:var(--primary);text-decoration:underline;font-size:12px;cursor:pointer;padding:0 4px;}
  .footer-link:hover{color:var(--primary-dark);}
  .hr{height:1px;background:var(--border);margin:16px 0;}

  /* ---------- OLX-style features ---------- */
  .item-card{position:relative;}
  .heart-btn{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.9);border:none;border-radius:50%;width:32px;height:32px;font-size:17px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15);z-index:2;padding:0;display:flex;align-items:center;justify-content:center;transition:transform .1s;}
  .heart-btn:hover{transform:scale(1.18);}
  .featured-ribbon{position:absolute;top:0;left:0;background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:3px 10px;border-radius:var(--radius) 0 10px 0;letter-spacing:.4px;z-index:1;}
  .negotiable-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:#fef3c7;color:#92400e;}
  .free-price{font-size:18px;font-weight:800;color:var(--success);}
  .view-count{font-size:11.5px;color:var(--muted);}
  .post-btn{background:var(--accent);border:none;color:#fff;font-weight:800;font-size:14px;padding:9px 18px;border-radius:9px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
  .post-btn:hover{background:#d97706;}
  .login-btn{background:#1a1a2e!important;}
  .login-btn:hover{background:#2d2d4e!important;}
  .auth-dismiss{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:0 0 12px 0;display:block;text-align:left;}  .auth-dismiss:hover{color:var(--ink);}

  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px;}
  .cat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 8px 14px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s,transform .15s;}
  .cat-tile:hover{border-color:var(--primary);box-shadow:0 4px 16px rgba(249,115,22,.18);transform:translateY(-2px);}
  .cat-tile-icon{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 2px;overflow:hidden;}
  .cat-emoji{font-size:34px;line-height:1;display:block;}
  .cat-tile-label{font-size:11px;font-weight:700;color:var(--ink);line-height:1.3;}
  .cat-tile-count{font-size:10px;color:var(--muted);}

  /* Home hero banner */
  .home-hero{background:linear-gradient(105deg,#1a1a2e 0%,#1f1f38 55%,#4a3728 100%);border-radius:18px;padding:22px 26px;display:flex;align-items:center;gap:20px;margin-bottom:20px;}
  .hero-logo{width:110px;height:110px;object-fit:contain;border-radius:14px;flex-shrink:0;}
  .hero-icons{height:130px;object-fit:contain;flex-shrink:0;margin-left:auto;opacity:0.95;}
  .hero-text{display:flex;flex-direction:column;justify-content:center;gap:8px;flex:1 1 auto;min-width:0;}
  .hero-title{
    font-family:'Baloo 2','Segoe UI',sans-serif;font-weight:800;color:#fff;
    font-size:clamp(28px,5.2vw,52px);line-height:1.08;letter-spacing:-.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .hero-sub{
    font-weight:600;color:#f3d9b1;
    font-size:clamp(15px,2.1vw,24px);line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .hero-tagline{height:120px;object-fit:contain;flex-shrink:0;opacity:0.9;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.3));}@media (max-width:640px){
    .hero-title,.hero-sub{
    font-weight:600;color:#f3d9b1;

  .safe-tips ul{margin:4px 0 0;padding-left:18px;}
  .safe-tips li{margin-bottom:3px;}
  .seller-other{margin-top:16px;}
  .seller-other-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
  .seller-other-grid{display:flex;gap:8px;flex-wrap:wrap;}
  .seller-thumb{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;min-width:90px;max-width:120px;text-align:center;font-size:12px;}
  .seller-thumb:hover{border-color:var(--primary);}
  .seller-thumb-icon{font-size:24px;}
  .seller-thumb-title{margin-top:4px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;}
  .seller-thumb-price{color:var(--primary-dark);font-weight:700;font-size:12px;}

  .report-reasons{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .report-reasons label{font-size:14px;display:flex;align-items:center;gap:8px;cursor:pointer;}
  .saved-empty{padding:40px 20px;text-align:center;color:var(--muted);}
  .member-since{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .verified-badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--success);background:var(--success-light);padding:2px 8px;border-radius:99px;margin-top:4px;}
  .saved-badge{background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;line-height:1.3;margin-left:4px;}

  .ads-tab-btn{padding:9px 18px;border:none;background:none;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;}
  .ads-tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);}
  .my-ad-row{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;}
  .my-ad-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px;}
  .my-ad-views{font-size:12px;color:var(--muted);}
  .my-ad-actions{display:flex;gap:6px;flex-shrink:0;flex-direction:column;align-items:flex-end;}

  /* ---------- Similar ads ---------- */
  .similar-section{margin-top:16px;}
  .similar-section-title{font-weight:700;font-size:14px;margin-bottom:10px;color:var(--ink);}
  .similar-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .similar-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;transition:box-shadow .15s;}

  .similar-icon{font-size:28px;margin-bottom:4px;}
  .similar-title{font-size:12px;font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .similar-price{font-size:12px;color:var(--primary-dark);font-weight:700;margin-top:3px;}
  .similar-city{font-size:11px;color:var(--muted);}

  /* ---------- Chat inbox ---------- */
  .chat-list{display:flex;flex-direction:column;gap:0;}
  .chat-row{display:flex;flex-direction:row;align-items:flex-start;text-align:left;gap:12px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
  .chat-row:hover{background:var(--primary-light);}
  .chat-row:first-child{border-radius:var(--radius) var(--radius) 0 0;}
  .chat-row:last-child{border-radius:0 0 var(--radius) var(--radius);border-bottom:none;}
  .chat-row.unread{background:#fff8f3;}
  .chat-avatar{font-size:21px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bg);border-radius:50%;border:1px solid var(--border);}
  .chat-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .chat-top{display:flex;align-items:baseline;gap:8px;}
  .chat-name{font-weight:600;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chat-row.unread .chat-name{font-weight:700;}
  .chat-item{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chat-preview{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chat-row.unread .chat-preview{color:var(--ink);font-weight:500;}
  .chat-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;padding-top:1px;}
  .chat-time{font-size:11px;color:var(--muted);flex-shrink:0;white-space:nowrap;}
  .chat-unread{width:8px;height:8px;border-radius:50%;background:var(--primary);display:block;}

  .auth-divider::before{left:0;} .auth-divider::after{right:0;}

  // Collect every subcategory name belonging to the given parent ids
  function subsOfParents(ids){
    var out = [];
    CATEGORY_TREE.forEach(function(p){
      if(ids.indexOf(p.id) >= 0) out = out.concat(p.subs);
    });
    return out;
  }

  // Categories that are neither sold nor bartered - you can only enquire about them.
  // Listed under "Services & More" on home. No price, no exchange, no Buy/Offer/Propose.
  var NO_TRADE_PARENTS = ["services","jobs"];
  var NO_TRADE_SUBS    = subsOfParents(NO_TRADE_PARENTS);

  // Properties are sold or rented, never bartered.
  // The subcategory name already says which, so we never ask the user.
  var PROPERTY_SUBS = subsOfParents(["properties"]);
  var RENT_SUBS = [

  // Shrink a photo before storing it. Phone photos are several megabytes as

  function compressImage(dataUrl, maxDim, quality, cb){
    // The callback must always fire exactly once — otherwise a photo that fails
    // to decode would be silently dropped instead of being saved as-is.
    var done = false;
    var finish = function(result){
      if(done) return;
      done = true;
      cb(result || dataUrl);
    };
    setTimeout(function(){ finish(dataUrl); }, 1500);
    try{
      var img = new Image();
      img.onload = function(){
        try{
          var w = img.width || 0, h = img.height || 0;
          if(!w || !h){ finish(dataUrl); return; }
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext && canvas.getContext("2d");
          if(!ctx){ finish(dataUrl); return; }
          ctx.drawImage(img, 0, 0, cw, ch);
          var out = canvas.toDataURL("image/jpeg", quality);
          finish(out && out.length < dataUrl.length ? out : dataUrl);
        }catch(e){ finish(dataUrl); }
      };
      img.onerror = function(){ finish(dataUrl); };
      img.src = dataUrl;
    }catch(e){ finish(dataUrl); }

  // Passwords are never stored as typed. Each account gets a random salt and we

  // NOTE: with no server this is obfuscation, not real protection — anyone with
  // the device can read the hash and brute-force a weak password. Real auth
  // (bcrypt/argon2 on a backend) is Phase 2.
  function sha256(ascii){
    function rightRotate(v, a){ return (v>>>a) | (v<<(32-a)); }

        hash[primeCounter] = (mathPow(candidate, 0.5)*maxWord)|0;
        k[primeCounter++]  = (mathPow(candidate, 1/3)*maxWord)|0;

    ascii += "\x80";
    while(ascii.length%64 - 56) ascii += "\x00";
    for(i = 0; i < ascii.length; i++){
      j = ascii.charCodeAt(i);
      if(j>>8) return "";
      words[i>>2] |= j << ((3-i)%4)*8;
    }
    words[words.length] = ((asciiBitLength/maxWord)|0);
    words[words.length] = (asciiBitLength);
    for(j = 0; j < words.length;){
      var w = words.slice(j, j += 16), oldHash = hash;
      hash = hash.slice(0, 8);
      for(i = 0; i < 64; i++){
        var w15 = w[i-15], w2 = w[i-2];
        var a = hash[0], e = hash[4];
        var temp1 = hash[7]
          + (rightRotate(e,6) ^ rightRotate(e,11) ^ rightRotate(e,25))
          + ((e&hash[5]) ^ ((~e)&hash[6]))
          + k[i]
          + (w[i] = (i<16) ? w[i] : (
              w[i-16]
              + (rightRotate(w15,7) ^ rightRotate(w15,18) ^ (w15>>>3))
              + w[i-7]
              + (rightRotate(w2,17) ^ rightRotate(w2,19) ^ (w2>>>10))
            )|0

        var temp2 = (rightRotate(a,2) ^ rightRotate(a,13) ^ rightRotate(a,22))
          + ((a&hash[1]) ^ (a&hash[2]) ^ (hash[1]&hash[2]));
        hash = [(temp1+temp2)|0].concat(hash);
        hash[4] = (hash[4]+temp1)|0;

  // Rolls the monthly quota over when a 30-day period has elapsed.
  function refreshBillingPeriod(u){
    if(!u || !u.id) return u;
    var now = nowTs();
    if(!u.planPeriodStart) u.planPeriodStart = now;
    if(now - u.planPeriodStart >= 30*DAY){
      var periods = Math.floor((now - u.planPeriodStart) / (30*DAY));
      u.planPeriodStart = u.planPeriodStart + periods*30*DAY;
      u.adsUsedThisPeriod = 0;
      // Monthly plan boosts refresh (unused monthly boosts do not stack)
      u.boostCredits = planById(u.plan||"free").boosts;
      // Downgrade to Free when a paid plan has expired
      if(u.plan && u.plan!=="free" && u.planExpiry && now > u.planExpiry){
        u.plan = "free";
        u.boostCredits = 0;
      }
    }
    return u;
  }

  function adsUsed(userId){
    var u = refreshBillingPeriod(userById(userId || UI.currentUserId));
    return u.adsUsedThisPeriod || 0;
  }
  function adsRemaining(userId){

  // ---- Ad lifetime: every ad runs for 30 days, as stated on the Plans page ----
  // (AD_LIFETIME_DAYS is declared with the other constants at the top.)
  function adExpiresAt(it){
    if(!it) return 0;
    return it.expiresAt || ((it.createdAt || nowTs()) + AD_LIFETIME_DAYS*DAY);
  }
  function isExpired(it){ return !!(it && it.status === "expired"); }
  function daysLeft(it){
    return Math.max(0, Math.ceil((adExpiresAt(it) - nowTs()) / DAY));
  }
  // Closes ads that have run their 30 days. Only touches ads still available,
  // so sold, traded and reserved ads keep their status.
  function expireOldAds(db){
    var now = nowTs(), changed = 0;
    (db.items||[]).forEach(function(it){
      if(!it.expiresAt) it.expiresAt = (it.createdAt || now) + AD_LIFETIME_DAYS*DAY;
      if(it.status === "available" && it.expiresAt <= now){
        it.status = "expired";
        changed++;
      }
    });
    return changed;
  }
  // Puts an expired ad back on the market for another 30 days. Counts against
  // the monthly ad quota, same as posting a new one.
  function repostListing(itemId){

    if(it.ownerId !== UI.currentUserId){ showToast("You can only repost your own ads."); return false; }
    var qu = refreshBillingPeriod(currentUser());
    if(qu && qu.id && adsRemaining(qu.id) <= 0){
      showToast("You've used all "+adsAllowed(qu.id)+" ads this month. Upgrade in the Plans tab to repost.");
      UI.tab = "pricing";
      return false;
    }
    it.status = "available";
    it.createdAt = nowTs();
    it.expiresAt = nowTs() + AD_LIFETIME_DAYS*DAY;
    if(qu && qu.id) qu.adsUsedThisPeriod = (qu.adsUsedThisPeriod||0) + 1;
    saveDB();
    showToast("Reposted — live for another "+AD_LIFETIME_DAYS+" days.");
    return true;
  }

  function migrateDB(db){
    if(!db.savedItems)    db.savedItems    = [];
    if(!db.reports)       db.reports       = [];
    if(!db.notifications) db.notifications = [];
    var now = nowTs();
    db.users.forEach(function(u){
      if(!u.memberSince) u.memberSince = now - Math.floor(Math.random()*300)*DAY;
      if(!u.phone) u.phone = "[hidden]";
      if(!u.email) u.email = u.phone.replace(/[0-9]/g, 'x') + "@baganto.com";
      // Add new fields
      if(!u.hasOwnProperty("isVerified")) u.isVerified = false;
      if(!u.hasOwnProperty("isAdmin")) u.isAdmin = false;
      if(!u.hasOwnProperty("phoneVerified")) u.phoneVerified = false;
      if(!u.hasOwnProperty("emailVerified")) u.emailVerified = false;
      if(!u.hasOwnProperty("idVerified")) u.idVerified = false;
      if(!u.hasOwnProperty("otp")) u.otp = null;
      if(!u.hasOwnProperty("otpExpiry")) u.otpExpiry = null;
      if(!u.hasOwnProperty("blockedUsers")) u.blockedUsers = [];
      if(!u.hasOwnProperty("reputationScore")) u.reputationScore = 50;
      if(!u.hasOwnProperty("dealCompletionRate")) u.dealCompletionRate = 0;
      if(!u.hasOwnProperty("responseTimeHours")) u.responseTimeHours = 24;
      if(!u.hasOwnProperty("fraudFlags")) u.fraudFlags = 0;
      // Pricing / subscription fields
      if(!u.hasOwnProperty("plan")) u.plan = "free";
      if(!u.hasOwnProperty("planPeriodStart")) u.planPeriodStart = now;
      if(!u.hasOwnProperty("planExpiry")) u.planExpiry = null;
      if(!u.hasOwnProperty("adsUsedThisPeriod")) u.adsUsedThisPeriod = 0;
      if(!u.hasOwnProperty("boostCredits")) u.boostCredits = 0;
      if(!u.hasOwnProperty("premiumCredits")) u.premiumCredits = [];
      // Uploaded profile picture (base64). Null = show the emoji avatar.
      if(!u.hasOwnProperty("avatarPhoto")) u.avatarPhoto = null;
      // Replace any plain-text password with a salted hash, once
      if(!u.pwHash){
        setUserPassword(u, u.password != null ? u.password : "demo123");
      } else if(u.password){
        delete u.password;
      }
    });
    if(!db.purchases) db.purchases = [];
    db.items.forEach(function(it){
      if(!it.hasOwnProperty("boostedUntil")) it.boostedUntil = null;
      if(!it.hasOwnProperty("premiumUntil")) it.premiumUntil = null;
    });
    expirePromotions(db);
    // Remember whether anything expired so loadDB can write it straight back
    db.__expiredNow = expireOldAds(db);
    db.deals.forEach(function(d){
      if(!d.hasOwnProperty("typingUsers")) d.typingUsers = [];
    });
    // Category migration map: old flat names → new subcategory names
    var CAT_MIGRATE = {
      "Electronics & Appliances": "Other Electronics",
      "Books, Sports & Hobbies":  "Sports Equipment",
      "Furniture":                "Other Household Items",
      "Fashion":                  "Men",
      "Vehicles":                 "Cars",
      "Kids & Baby Care":         "Toys & Baby",
      "Mobiles":                  "Mobile Phones",
      "Tools & Equipment":        "Tools & Equipment",
      // Retired Services/Jobs subcategories
      "Home & Repair Services":   "Home Renovation & Repair",
      "Full Time Jobs":           "Other Jobs",
      "Part Time Jobs":           "Other Jobs",
      "Internships":              "Other Jobs",
      "Services":                 "Other Services",
      "Jobs":                     "Other Jobs"
    };
    db.items.forEach(function(it){
      if(!it.condition) it.condition = "good";
      if(it.negotiable==null) it.negotiable = false;
      if(!it.views)       it.views       = Math.floor(Math.random()*80)+5;
      if(it.isFeatured==null) it.isFeatured = false;
      // Remap old category names to new subcategory names
      if(CAT_MIGRATE[it.category]) it.category = CAT_MIGRATE[it.category];
      if(isNoBarter(it.category)){ it.forBarter = false; it.wantInExchange = ""; }
      if(isNoTrade(it.category)){ it.forSale = false; it.price = null; it.negotiable = false; }
    });
    return db;
  }

  function cityCoord(name){ for(var i=0;i<CITIES.length;i++){ if(CITIES[i].name===name) return CITIES[i]; } return CITIES[0]; }

  function distanceKm(cityA, cityB){
    if(cityA===cityB) return 0;
    var a=cityCoord(cityA), b=cityCoord(cityB);
    var toRad=function(d){return d*Math.PI/180;};
    var R=6371;
    var dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
    var sa=Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)*Math.sin(dLng/2);
    var c=2*Math.atan2(Math.sqrt(sa), Math.sqrt(1-sa));
    return Math.round(R*c);
  }

  function nearestCity(lat, lng){
    var nearest = CITIES[0];
    var minDist = 999999;
    for(var i=0;i<CITIES.length;i++){
      var toRad=function(d){return d*Math.PI/180;};
      var R=6371;
      var dLat=toRad(CITIES[i].lat-lat), dLng=toRad(CITIES[i].lng-lng);
      var sa=Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(toRad(lat))*Math.cos(toRad(CITIES[i].lat))*Math.sin(dLng/2)*Math.sin(dLng/2);
      var c=2*Math.atan2(Math.sqrt(sa), Math.sqrt(1-sa));
      var dist=R*c;
      if(dist<minDist){ minDist=dist; nearest=CITIES[i]; }
    }
    return nearest.name;
  }

  function detectLocation(){
    if(!navigator.geolocation){
      showToast("Geolocation not supported in your browser");
      return;
    }
    var locInput = document.querySelector("input[name='city']");
    var detectBtn = document.querySelector("[data-action='detect-location']");
    if(detectBtn) detectBtn.disabled = true;
    navigator.geolocation.getCurrentPosition(
      function(position){
        var lat = position.coords.latitude;
        var lng = position.coords.longitude;
        var nearest = nearestCity(lat, lng);
        if(locInput){
          locInput.value = nearest;
          locInput.dataset.detected = "true";
        }
        showToast("📍 Location detected: " + nearest);
        if(detectBtn) detectBtn.disabled = false;
      },
      function(error){
        showToast("Location access denied. Please enter manually.");
        if(detectBtn) detectBtn.disabled = false;
      }
    );
  }

  function autoDetectLocation(){
    if(!navigator.geolocation || !UI.currentUserId) return;
    navigator.geolocation.getCurrentPosition(
      function(position){
        var lat = position.coords.latitude;
        var lng = position.coords.longitude;
        var nearest = nearestCity(lat, lng);
        var user = userById(UI.currentUserId);
        if(user && user.city !== nearest){
          user.city = nearest;
          saveDB();
          var input = document.getElementById("navLocationInput");
          if(input) input.value = nearest;
        }
      },
      function(error){
        // Silently fail
      },
      {timeout: 5000, enableHighAccuracy: false}
    );
  }

  function userRating(userId){
    var rs=[]; for(var i=0;i<DB.ratings.length;i++){ if(DB.ratings[i].toUserId===userId) rs.push(DB.ratings[i]); }
    if(!rs.length) return {avg:0, count:0};
    var sum=0; for(var j=0;j<rs.length;j++) sum+=rs[j].stars;
    return {avg: sum/rs.length, count: rs.length};
  }

  function generateOTP(){
    return Math.floor(100000 + Math.random() * 900000).toString();
  }

  function sendOTP(userId){
    var user = userById(userId);
    if(!user) return false;
    var otp = generateOTP();
    var expiryTime = Date.now() + 10*60*1000; // 10 minutes
    user.otp = otp;
    user.otpExpiry = expiryTime;
    saveDB();
    showToast("📱 OTP sent: " + otp + " (for demo purposes, normally sent via SMS)");
    return true;
  }

  function verifyOTP(userId, enteredOTP){
    var user = userById(userId);
    if(!user) return false;
    if(!user.otp || !user.otpExpiry) return false;
    if(Date.now() > user.otpExpiry){ showToast("OTP expired. Request new one."); return false; }
    if(user.otp !== enteredOTP){ showToast("Invalid OTP."); return false; }
    user.phoneVerified = true;
    user.otp = null;
    user.otpExpiry = null;
    saveDB();
    showToast("✅ Phone verified!");
    return true;
  }

  function starsStr(avg){

  function timeAgo(ts){
    var diff = nowTs()-ts;
    var mins = Math.floor(diff/60000);
    if(mins < 1) return "just now";
    if(mins < 60) return mins+"m ago";
    var hrs = Math.floor(mins/60);
    if(hrs < 24) return hrs+"h ago";
    var days = Math.floor(hrs/24);
    if(days < 30) return days+"d ago";
    return new Date(ts).toLocaleDateString();
  }

  // Clock time inside a chat bubble, e.g. "4:12 pm"
  function formatClock(ts){
    try{
      return new Date(ts).toLocaleTimeString("en-IN", {hour:"numeric", minute:"2-digit", hour12:true}).toLowerCase();
    }catch(e){
      var dt = new Date(ts), h = dt.getHours(), m = dt.getMinutes();
      var ap = h>=12 ? "pm" : "am"; h = h%12; if(h===0) h=12;
      return h+":"+(m<10?"0":"")+m+" "+ap;
    }
  }
  // Divider label above the first message of each day
  function chatDayLabel(ts){
    var startOf = function(t){ var x=new Date(t); x.setHours(0,0,0,0); return x.getTime(); };
    var days = Math.round((startOf(nowTs()) - startOf(ts)) / DAY);
    if(days===0) return "Today";
    if(days===1) return "Yesterday";
    if(days < 7){ try{ return new Date(ts).toLocaleDateString("en-IN",{weekday:"long"}); }catch(e){} }
    try{ return new Date(ts).toLocaleDateString("en-IN",{day:"numeric", month:"short", year:"numeric"}); }
    catch(e){ return new Date(ts).toLocaleDateString(); }
  }
  function sameDay(a, b){
    var x=new Date(a), y=new Date(b);
    return x.getFullYear()===y.getFullYear() && x.getMonth()===y.getMonth() && x.getDate()===y.getDate();
  }

  // -------- TRUST & SAFETY HELPERS --------
  function calculateReputationScore(userId){
    // Based on user's ratings from completed deals
    var ratings = DB.ratings.filter(function(r){ return r.toUserId === userId; });
    if(ratings.length === 0) return 50; // Default neutral score
    var total = ratings.reduce(function(s, r){ return s + (r.stars || 3); }, 0);
    var avg = total / ratings.length;
    // Scale 0-5 stars to 0-100 reputation
    var score = Math.round((avg / 5) * 100);
    return Math.max(0, Math.min(100, score));
  }

  function calculateDealCompletionRate(userId){
    // Percentage of completed/accepted deals out of total deals
    var allDeals = DB.deals.filter(function(d){ return d.fromUserId === userId || d.toUserId === userId; });
    if(allDeals.length === 0) return 0;
    var completed = allDeals.filter(function(d){ return d.status === "completed" || d.status === "accepted"; });
    return Math.round((completed.length / allDeals.length) * 100);
  }

  function calculateResponseTime(userId){
    // Average hours between deal creation and first response message
    var userMessages = DB.messages.filter(function(m){ return m.fromUserId === userId; });
    if(userMessages.length === 0) return 24; // Default 24 hours
    var times = [];
    userMessages.forEach(function(msg){
      var deal = DB.deals.find(function(d){ return d.id === msg.dealId; });
      if(deal && msg.createdAt && deal.createdAt){
        var hoursDiff = (msg.createdAt - deal.createdAt) / (60*60*1000);
        if(hoursDiff >= 0 && hoursDiff <= 168) times.push(hoursDiff); // 0-7 days only
      }
    });
    if(times.length === 0) return 24;
    var avg = times.reduce(function(a,b){ return a+b; }, 0) / times.length;
    return Math.round(avg * 10) / 10;
  }

  // -------- FRAUD DETECTION --------
  function detectFraudFlags(userId){
    var user = userById(userId);
    var flags = 0;
    if(!user) return flags;

    // Flag 1: Unverified account with multiple reports
    var reportCount = (DB.reports || []).filter(function(r){ return r.reportedBy === userId; }).length;
    if(!user.phoneVerified && reportCount > 2) flags++;

    // Flag 2: Many failed/rejected deals
    var allDeals = DB.deals.filter(function(d){ return d.fromUserId === userId || d.toUserId === userId; });
    var rejectedDeals = allDeals.filter(function(d){ return d.status === "rejected"; });
    if(rejectedDeals.length > allDeals.length * 0.5 && allDeals.length > 3) flags++;

    // Flag 3: Very low reputation score
    if(calculateReputationScore(userId) < 40 && DB.ratings.filter(function(r){ return r.toUserId === userId; }).length > 2) flags++;

    // Flag 4: Rapid account activity (many listings in short time)
    var now = nowTs();
    var recentListings = DB.items.filter(function(it){ return it.ownerId === userId && (now - it.createdAt) < 7*DAY; });
    if(recentListings.length > 10) flags++;

    // Flag 5: Price manipulation (asking price way above market, then dropping to near-free)
    var userItems = DB.items.filter(function(it){ return it.ownerId === userId && it.forSale; });
    var priceVariance = 0;
    if(userItems.length > 2){
      var prices = userItems.map(function(it){ return it.price || 0; }).filter(function(p){ return p > 0; });
      if(prices.length > 1){
        var max = Math.max.apply(null, prices);
        var min = Math.min.apply(null, prices);
        if(max > 0 && min / max < 0.1) priceVariance++;
      }
    }
    flags += priceVariance;

    return Math.min(flags, 5); // Cap at 5 flags
  }

  function getFraudRiskLevel(userId){
    var flags = detectFraudFlags(userId);
    if(flags === 0) return "safe"; // Green
    if(flags <= 1) return "low"; // Yellow
    if(flags <= 2) return "medium"; // Orange
    return "high"; // Red
  }

  function getFraudWarning(userId){
    var risk = getFraudRiskLevel(userId);
    if(risk === "safe") return "";
    var message = {
      "low": "⚠️ This seller has some flagged activity. Trade with caution.",
      "medium": "⚠️ This seller has multiple fraud flags. Verify items carefully before trading.",
      "high": "🚨 HIGH RISK: This seller has serious fraud flags. Exercise extreme caution or consider reporting."
    };
    return '<div style="background:#fff3cd;border-left:4px solid #ffc107;padding:8px 12px;margin:8px 0;border-radius:4px;font-size:12px;color:#856404;">'+message[risk]+'</div>';
  }

  // ---------------- Actions ----------------
  function lockItemsAndRejectOthers(deal){
    var req = itemById(deal.requestedItemId);
    // A described (non-listed) offer has no ad to lock
    if(deal.offeredItemId) itemById(deal.offeredItemId).status = "pending";
    req.status = "pending";
    for(var i=0;i<DB.deals.length;i++){
      var d = DB.deals[i];
      if(d.id===deal.id) continue;
      if(d.status==="pending" && (d.offeredItemId===deal.offeredItemId || d.requestedItemId===deal.requestedItemId || d.offeredItemId===deal.requestedItemId || d.requestedItemId===deal.offeredItemId)){
        d.status = "rejected";
      }
    }
  }

  function sendMessage(dealId, text, photos){
    text = (text||"").trim();
    photos = photos || [];
    // A message needs either text or at least one photo
    if(!text && !photos.length) return;
    // Blocking works both ways — neither side can message the other
    var dlk = DB.deals.filter(function(d){ return d.id===dealId; })[0];
    if(dlk){
      var otherId = dlk.fromUserId===UI.currentUserId ? dlk.toUserId : dlk.fromUserId;
      if(isUserBlocked(otherId, UI.currentUserId)){
        showToast("You blocked this user. Unblock them to send a message.");
        return;
      }
      if(isUserBlocked(UI.currentUserId, otherId)){
        showToast("You can't message this user.");
        return;
      }
    }
    DB.messages.push({id:uid("m"), dealId:dealId, senderId:UI.currentUserId, text:text, photos:photos.slice(0), createdAt:nowTs()});
    var dl = DB.deals.filter(function(d){ return d.id===dealId; })[0];
    if(dl){
      var other = dl.fromUserId===UI.currentUserId ? dl.toUserId : dl.fromUserId;
      var note = (!text && photos.length) ? " sent you a photo" : " sent you a message";
      addNotification(other, "message", currentUser().name+note, {dealId:dealId});
    }
    saveDB();
  }

    // A described item has no ad behind it, so offeredItemId stays empty

    var d = {id:uid("d"), kind:"barter", fromUserId:UI.currentUserId, toUserId:reqItem.ownerId,
             offeredItemId: isCustom ? null : offeredItemId,
             offeredText: isCustom ? offeredText : "",
             requestedItemId:requestedItemId, status:"pending", createdAt:nowTs(), completedAt:null};
    DB.deals.push(d);
    if((message && message.trim()) || photos.length){

    var myDealIds = DB.deals.filter(function(d){ return d.fromUserId===u.id || d.toUserId===u.id; }).map(function(d){ return d.id; });

      if(k==="pwHash" || k==="pwSalt" || k==="password" || k==="otp" || k==="otpExpiry" || k==="emailOtp" || k==="emailOtpExpiry") continue;
      safeUser[k] = u[k];
    }
    var payload = {
      exportedAt: new Date().toISOString(),
      note: "Your Baganto data. Passwords and one-time codes are deliberately excluded.",
      profile: safeUser,
      myAds: DB.items.filter(function(it){ return it.ownerId===u.id; }),
      myDeals: DB.deals.filter(function(d){ return myDealIds.indexOf(d.id)>=0; }),
      myMessages: DB.messages.filter(function(m){ return myDealIds.indexOf(m.dealId)>=0; }),
      reviewsAboutMe: DB.ratings.filter(function(r){ return r.toUserId===u.id; }),

      purchases: (DB.purchases||[]).filter(function(p){ return p.userId===u.id; })
    };
    try{
      var text = JSON.stringify(payload, null, 2);

      document.body.removeChild(a);

      showToast("Your data has been downloaded.");
    }catch(e){
      showToast("Could not create the download on this browser.");
    }
  }

  // Erases the signed-in account and everything attached to it.
  function deleteMyAccount(){
    var u = currentUser();
    if(!u || !u.id){ showToast("Log in first."); return; }
    if(DB.users.length <= 1){ showToast("This is the only account — reset the demo data instead."); return; }
    if(!window.confirm("Permanently delete your account?\n\nThis removes your profile, ads, chats, messages, reviews and saved ads. It cannot be undone.")) return;
    var typed = window.prompt('This cannot be undone. Type DELETE to confirm:');
    if(!typed || typed.trim().toUpperCase() !== "DELETE"){ showToast("Account deletion cancelled."); return; }

    var uid_ = u.id, name = u.name;
    var myDealIds = DB.deals.filter(function(d){ return d.fromUserId===uid_ || d.toUserId===uid_; }).map(function(d){ return d.id; });

    DB.items    = DB.items.filter(function(it){ return it.ownerId!==uid_; });
    DB.deals    = DB.deals.filter(function(d){ return myDealIds.indexOf(d.id)===-1; });
    DB.messages = DB.messages.filter(function(m){ return myDealIds.indexOf(m.dealId)===-1; });
    DB.ratings  = DB.ratings.filter(function(r){ return r.fromUserId!==uid_ && r.toUserId!==uid_; });
    if(DB.savedItems)    DB.savedItems    = DB.savedItems.filter(function(s){ return s.userId!==uid_; });
    if(DB.notifications) DB.notifications = DB.notifications.filter(function(n){ return n.userId!==uid_; });
    if(DB.reports)       DB.reports       = DB.reports.filter(function(r){ return r.userId!==uid_ && r.reportedBy!==uid_; });
    if(DB.purchases)     DB.purchases     = DB.purchases.filter(function(p){ return p.userId!==uid_; });
    // Remove them from everyone else's block lists too
    DB.users.forEach(function(other){
      if(other.blockedUsers) other.blockedUsers = other.blockedUsers.filter(function(id){ return id!==uid_; });
    });
    DB.users = DB.users.filter(function(uu){ return uu.id!==uid_; });

    UI.currentUserId = "";
    storageSet(USER_KEY, "");
    UI.authScreen = true;
    UI.authPage   = "login";
    UI.modal = null;
    UI.tab = "market";
    saveDB();
    showToast("Account \"" + name + "\" and all its data were deleted.");
  }

  function deleteProfile(userId){
    if(DB.users.length <= 1){ showToast("Can\'t delete the only profile."); return; }
    var u = userById(userId);
    if(!window.confirm("Delete the profile \"" + u.name + "\"? This also removes their listings, trades, messages and reviews. This can\'t be undone.")) return;

    var removedDealIds = DB.deals.filter(function(d){ return d.fromUserId===userId || d.toUserId===userId; }).map(function(d){ return d.id; });

    DB.items = DB.items.filter(function(it){ return it.ownerId!==userId; });
    DB.deals = DB.deals.filter(function(d){ return d.fromUserId!==userId && d.toUserId!==userId; });
    DB.messages = DB.messages.filter(function(m){ return removedDealIds.indexOf(m.dealId)===-1; });
    DB.ratings = DB.ratings.filter(function(r){ return r.fromUserId!==userId && r.toUserId!==userId; });
    DB.users = DB.users.filter(function(uu){ return uu.id!==userId; });

    if(UI.currentUserId===userId){
      UI.currentUserId = DB.users[0].id;
      storageSet(USER_KEY, UI.currentUserId);
    }
    UI.modal = null;
    saveDB();
    showToast("Profile \"" + u.name + "\" deleted.");
  }

  function submitRating(dealId, toUserId, stars, review){
    DB.ratings.push({id:uid("r"), dealId:dealId, fromUserId:UI.currentUserId, toUserId:toUserId, stars:stars, review:(review||"").trim(), createdAt:nowTs()});
    addNotification(toUserId, "rating", currentUser().name+" rated you "+stars+"\u2605", {dealId:dealId});
    saveDB();
    showToast("Rating submitted. Thanks!");
  }

  // ---------- OLX-style actions ----------

  function isSaved(itemId){
    for(var i=0;i<DB.savedItems.length;i++){
      if(DB.savedItems[i].userId===UI.currentUserId && DB.savedItems[i].itemId===itemId) return true;
    }
    return false;
  }
  function toggleSave(itemId){
    if(isSaved(itemId)){
      DB.savedItems = DB.savedItems.filter(function(s){ return !(s.userId===UI.currentUserId && s.itemId===itemId); });
      showToast("Removed from saved ads.");
    } else {
      DB.savedItems.push({userId:UI.currentUserId, itemId:itemId});
      var svIt = itemById(itemId);
      if(svIt && svIt.id!=="__missing__") addNotification(svIt.ownerId, "save", currentUser().name+" saved your "+svIt.title, {itemId:itemId});
      showToast("❤️ Added to saved ads.");
    }
    saveDB();
  }
  function savedCount(userId){
    var n=0; for(var i=0;i<DB.savedItems.length;i++){ if(DB.savedItems[i].userId===userId) n++; } return n;
  }

  // -------- Notifications --------
  function addNotification(userId, type, text, opts){
    if(!userId || userId===UI.currentUserId) return; // don't notify yourself
    if(!DB.notifications) DB.notifications = [];
    opts = opts || {};
    DB.notifications.push({
      id: uid("n"),
      userId: userId,
      type: type,
      text: text,
      itemId: opts.itemId || null,
      dealId: opts.dealId || null,
      read: false,
      createdAt: nowTs()
    });
    saveDB();
  }
  function myNotifications(){
    if(!DB.notifications) return [];
    return DB.notifications
      .filter(function(n){ return n.userId===UI.currentUserId; })
      .sort(function(a,b){ return b.createdAt-a.createdAt; });
  }
  function unreadNotificationCount(){
    if(!DB.notifications) return 0;
    var n=0;
    for(var i=0;i<DB.notifications.length;i++){
      if(DB.notifications[i].userId===UI.currentUserId && !DB.notifications[i].read) n++;
    }
    return n;
  }
  function markAllNotificationsRead(){
    if(!DB.notifications) return;
    DB.notifications.forEach(function(n){ if(n.userId===UI.currentUserId) n.read = true; });
    saveDB();
  }

    if(type==="message") return "💬";
    if(type==="offer")   return "💰";
    if(type==="barter")  return "🔄";
    if(type==="deal")    return "🤝";
    if(type==="rating")  return "⭐";
    if(type==="save")    return "❤️";

  function incrementViews(itemId){
    var it = itemById(itemId);
    if(!it || it.id==="__missing__") return;
    it.views = (it.views||0) + 1;
    saveDB();
  }

  function trackRecentlyViewed(itemId){
    UI.recentlyViewed = UI.recentlyViewed.filter(function(id){ return id!==itemId; });
    UI.recentlyViewed.unshift(itemId);
    if(UI.recentlyViewed.length > 8) UI.recentlyViewed = UI.recentlyViewed.slice(0,8);
  }

  function sendAvailableQuery(itemId){
    var it = itemById(itemId);
    // We need an existing deal/chat thread, or create an offer query as a message on a new "query" deal
    // For simplicity, create a barter-style "query" deal (kind:"query") or send as a message on an existing pending deal
    // Check if there\'s already a deal for this item
    var existingDeal = null;
    for(var i=0;i<DB.deals.length;i++){
      var d=DB.deals[i];
      if((d.fromUserId===UI.currentUserId || d.toUserId===UI.currentUserId) &&
         (d.itemId===itemId || d.requestedItemId===itemId) &&
         d.status==="pending") { existingDeal=d; break; }
    }
    if(existingDeal){
      sendMessage(existingDeal.id, "Hi! Is this still available?");
      UI.modal = {type:"trade", dealId:existingDeal.id};
      showToast("Message sent!");
    } else {
      // create a lightweight "query" deal
      var d2 = {id:uid("d"), kind:"query", fromUserId:UI.currentUserId, toUserId:it.ownerId, itemId:itemId, status:"pending", createdAt:nowTs(), completedAt:null};
      DB.deals.push(d2);
      DB.messages.push({id:uid("m"), dealId:d2.id, senderId:UI.currentUserId, text:"Hi! Is this still available?", createdAt:nowTs()});
      saveDB();
      UI.modal = {type:"trade", dealId:d2.id};
      showToast("Message sent - check My Trades for the reply.");
    }
    render();
  }

  function makeOffer(itemId, offerPrice, message, photos){
    var it = itemById(itemId);
    if(!it) return;
    photos = photos || [];
    var d = {id:uid("d"), kind:"offer", fromUserId:UI.currentUserId, toUserId:it.ownerId, itemId:itemId, price:offerPrice, status:"pending", createdAt:nowTs(), completedAt:null};
    DB.deals.push(d);
    var txt = "Hi! I\'d like to offer ₹" + Number(offerPrice).toLocaleString("en-IN") + " for your " + it.title + "." + (message ? " " + message.trim() : "");
    DB.messages.push({id:uid("m"), dealId:d.id, senderId:UI.currentUserId, text:txt, photos:photos.slice(0), createdAt:nowTs()});
    addNotification(it.ownerId, "offer", currentUser().name+" offered "+formatINR(offerPrice)+" for your "+it.title, {itemId:itemId, dealId:d.id});
    saveDB();
    showToast("Offer sent for " + formatINR(offerPrice) + "! Check My Trades.");
    UI.modal = {type:"trade", dealId:d.id};
    render();
  }

  function reportItem(itemId, reason){
    DB.reports.push({id:uid("rep"), userId:UI.currentUserId, itemId:itemId, reason:reason, createdAt:nowTs()});
    saveDB();
    showToast("Ad reported. Thank you - we\'ll review it.");
  }

  function markItemSold(itemId){
    var it = itemById(itemId);
    if(!it || it.ownerId!==UI.currentUserId) return;
    if(!window.confirm("Mark \""+it.title+"\" as Sold?")) return;
    it.status = "sold";
    saveDB();
    showToast("\""+it.title+"\" marked as sold.");
  }

  function saveEditedListing(itemId, data){
    var it = itemById(itemId);
    if(!it || it.ownerId!==UI.currentUserId) return;
    it.title      = data.title      || it.title;
    it.category   = data.category   || it.category;
    it.city       = data.city       || it.city;
    it.condition  = data.condition  || it.condition;
    it.description= data.description!==undefined ? data.description : it.description;
    var ntE = isNoTrade(it.category);
    var prE = isProperty(it.category);
    it.forSale    = !ntE && (prE || data.forSale);
    it.price      = (!ntE && (prE || data.forSale)) ? data.price : null;
    it.negotiable = !ntE && data.negotiable;
    it.forBarter  = !ntE && !prE && data.forBarter;
    it.wantInExchange = (!ntE && !prE && data.forBarter) ? data.wantInExchange : "";
    it.icon       = data.icon       || it.icon;
    it.photos     = data.photos || it.photos || [];
    saveDB();
    showToast("Ad updated successfully!");
  }

  function addToRecentSearches(q){
    var trimmed = q.trim();
    if(!trimmed) return;
    UI.recentSearches = UI.recentSearches.filter(function(s){ return s!==trimmed; });
    UI.recentSearches.unshift(trimmed);
    if(UI.recentSearches.length>5) UI.recentSearches = UI.recentSearches.slice(0,5);
  }

  function shareItem(itemId){
    var it = itemById(itemId);
    if(!it) return;
    var text = it.title + (it.forSale?" - "+formatINR(it.price):"") + " | Baganto";
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showToast("Ad details copied to clipboard!");
      }).catch(function(){
        showToast("Share: " + text);
      });
    } else {
      showToast("Share: "+text);
    }
  }

    '<div class="legal-callout">Baganto is a peer-to-peer facilitator, not the seller of any item, and does not process or hold payment. Payment and item handover happen directly between buyer and seller (for example, cash or UPI at an agreed meeting point), unless a specific in-app payment feature states otherwise at the time. Because Baganto does not handle the money, <strong>Baganto itself cannot issue refunds</strong> - any refund must be arranged directly between buyer and seller.</div>',
    '<ul>',
      '<li>Before handover, either party may cancel a pending purchase within the app at no cost.</li>',
      '<li>After handover, returns or refunds are at the discretion and mutual agreement of the buyer and seller, since the transaction occurs directly between them. We encourage sellers to describe items accurately and honor reasonable return requests, and buyers to inspect items carefully before completing a purchase.</li>',
    '</ul>',
    '<h2>4. Consumer Protection (E-Commerce) Rules, 2020</h2>',
    '<p>Baganto operates as a marketplace connecting individual buyers and sellers, rather than selling items itself. Consistent with the marketplace model under the Consumer Protection (E-Commerce) Rules, 2020, individual sellers using the Platform are responsible for the accuracy of their own listings and for honoring fair grievance redressal towards buyers for their own sales. Baganto will reasonably assist in resolving disputes raised in good faith, including by suspending profiles found to be engaging in fraudulent sales.</p>',
    '<h2>5. Resolving a Dispute</h2>',
    '<ol style="padding-left:20px;font-size:14px;line-height:1.7;color:var(--ink);">',
      '<li>Use the in-app chat on the relevant trade to try to resolve the issue directly with the other user.</li>',
      '<li>If unresolved, contact us at <strong>[Support Email]</strong> with the trade details.</li>',
      '<li>For complaints that remain unresolved, you may escalate to our Grievance Officer - see the <button class="footer-link" style="font-size:14px;" data-action="open-legal" data-page="grievance">Grievance Redressal page</button>.</li>',

    '<h2>6. Fraud & Suspicious Transactions</h2>',
    '<p>If you believe you have been the victim of a fraudulent listing or trade, report it immediately to <strong>[Support Email]</strong>. We may suspend any profile involved in suspected fraud and, where appropriate, assist you in reporting the matter to the relevant authorities. Because payments are not processed through the Platform, we cannot guarantee recovery of funds or items exchanged off-platform.</p>',

      return '<div class="auth-screen">'+
        '<div class="auth-card">'+
          '<div class="auth-logo">'+logoTag+'</div>'+
          '<button class="auth-dismiss" data-action="dismiss-auth">&larr; Continue browsing</button>'+
          '<div class="auth-title">Create Account</div>'+
          '<div class="auth-sub">Join Baganto and start trading</div>'+
          '<div class="auth-error" id="authError"></div>'+
          '<form data-form="auth-signup">'+
            '<div class="auth-field"><label>Full Name</label>'+
              '<input type="text" name="fullname" placeholder="Your name" required></div>'+
            '<div class="auth-field"><label>Email Address</label>'+
              '<input type="email" name="email" placeholder="your@email.com" required></div>'+
            '<div class="auth-field"><label>Phone Number</label>'+
              '<input type="tel" name="phone" placeholder="10-digit phone number" required></div>'+
            '<div class="auth-field"><label>City</label>'+
              '<select name="city">'+CITIES.map(function(c){ return '<option value="'+esc(c.name)+'">'+esc(c.name)+'</option>'; }).join("")+'</select></div>'+
            '<div class="auth-field"><label>Password</label>'+
              '<input type="password" name="password" placeholder="Create a password" required></div>'+
            '<button type="submit" class="auth-btn">Create Account</button>'+
          '</form>'+
          '<div class="auth-switch" style="margin-top:16px;">Already have an account? <a data-action="goto-login">Login</a></div>'+
        '</div>'+

  }
  function render(){
    if(UI.authScreen){
      document.getElementById("app").innerHTML = renderAuth();
      return;
    }
    var app = document.getElementById("app");
    var active = document.activeElement;
    var activeId = (active && active.id) ? active.id : null;
    var selStart=null, selEnd=null;
    if(active && (active.tagName==="INPUT" || active.tagName==="TEXTAREA")){
      try{ selStart=active.selectionStart; selEnd=active.selectionEnd; }catch(e){}
    }

    var html = renderNav() + renderStorageWarning() + '<div class="wrap">' + renderTabContent() + '</div>' + renderModal() + renderPhotoViewer() + renderToast() + renderFooter();
    app.innerHTML = html;

    if(activeId){
      var el = document.getElementById(activeId);
      if(el){
        el.focus();
        if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
      }
    }

    // Keep the chat thread scrolled to the newest message
    var cbox = document.querySelector(".chat-box");
    if(cbox){ try{ cbox.scrollTop = cbox.scrollHeight; }catch(e){} }

    // Auto-detect location on render if user is logged in
    if(UI.currentUserId){
      setTimeout(function(){ autoDetectLocation(); }, 500);
    }
  }

  function renderFooter(){
    var links = LEGAL_ORDER.map(function(k){
      return '<button class="footer-link" data-action="open-legal" data-page="'+k+'">'+esc(LEGAL_DOCS[k].title)+'</button>';
    }).join(' · ');
    return '<div class="footer-note">Baganto is a demo prototype for the Indian market - all data is stored locally in your browser.' +
      '<div class="footer-links">'+links+'</div>' +
    '</div>';
  }

  // How much of the browser's ~5 MB allowance the app is using. Photos are by
  // far the biggest cost, so this gives a warning before things fill up.
  function renderStorageMeter(){
    var used = storageUsedBytes();
    if(!used) return "";
    var limit = 5*1024*1024;
    var pct = Math.min(100, Math.round(used/limit*100));
    var mb = (used/1048576).toFixed(1);
    var colour = pct >= 85 ? "#ef4444" : (pct >= 60 ? "#f59e0b" : "var(--primary)");
    return '<div style="margin-bottom:10px;">' +
      '<div style="font-size:12px;color:var(--muted);margin-bottom:4px;">Storage used: <b>'+mb+' MB</b> of about 5 MB ('+pct+'%)' +
        (pct >= 85 ? ' — delete some photos or old ads soon' : '') + '</div>' +
      '<div style="height:6px;background:var(--border);border-radius:6px;overflow:hidden;">' +
        '<div style="height:100%;width:'+pct+'%;background:'+colour+';"></div>' +
      '</div>' +
    '</div>';
  }

  // Shown when the browser refuses to save any more data, so changes are not
  // silently lost on the next reload.
  function renderStorageWarning(){
    if(!storageFullWarned) return "";
    return '<div style="background:#fef2f2;border-bottom:1px solid #fecaca;color:#991b1b;padding:10px 18px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
      '<b>⚠️ Storage full.</b>' +
      '<span>New ads, photos and messages will be lost when you reload. Delete some photos or old ads to free up space.</span>' +
      '<button class="btn btn-sm" data-action="goto-tab" data-tab="listings" style="margin-left:auto;">Manage my ads</button>' +
    '</div>';
  }

  // Full-size view for a photo tapped inside a chat
  function renderPhotoViewer(){
    if(!UI.chatPhotoView) return "";
    return '<div data-action="close-photo-view" style="position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;">' +
      '<img src="'+UI.chatPhotoView+'" alt="Photo" style="max-width:100%;max-height:100%;border-radius:10px;">' +
      '<button class="btn btn-sm" data-action="close-photo-view" style="position:absolute;top:16px;right:16px;background:#fff;">Close</button>' +
    '</div>';
  }

  function renderToast(){
    if(!UI.toast) return "";
    return '<div class="toast">'+esc(UI.toast.msg)+'</div>';
  }

  function renderNav(){
    var badge  = pendingIncomingCount(UI.currentUserId);
    var saved  = savedCount(UI.currentUserId);
    var tabs = [
      {id:"market",   label:"Home"},
      {id:"listings", label:"My Ads"},

  function renderNotifBell(){
    var unread = unreadNotificationCount();
    var bell = '<button class="notif-bell" data-action="toggle-notifs" title="Notifications">🔔' +
      (unread>0 ? '<span class="notif-count">'+(unread>9?'9+':unread)+'</span>' : '') +
      '</button>';
    if(!UI.notifOpen) return '<div class="notif-wrap">'+bell+'</div>';

    var list = myNotifications();
    var body;
    if(!list.length){
      body = '<div class="notif-empty">🔔<br>No notifications yet.</div>';
    } else {
      body = list.slice(0,30).map(function(n){
        return '<div class="notif-item'+(n.read?'':' unread')+'" data-action="open-notif" data-id="'+n.id+'">' +
          '<span class="notif-ico">'+notificationIcon(n.type)+'</span>' +
          '<span class="notif-text">'+esc(n.text)+'<br><span class="notif-time">'+timeAgo(n.createdAt)+'</span></span>' +
        '</div>';
      }).join("");
    }
    return '<div class="notif-wrap">' + bell +
      '<div class="notif-panel">' +
        '<div class="notif-head"><b>Notifications</b>' +
          (list.length ? '<button class="btn btn-ghost btn-sm" data-action="mark-notifs-read">Mark all read</button>' : '') +
        '</div>' +
        '<div class="notif-list">'+body+'</div>' +
      '</div></div>';
  }

  function renderTabContent(){
    if(UI.legalPage) return renderLegalPage();
    if(UI.tab==="market") return renderMarket();
    if(UI.tab==="listings") return renderListings();
    if(UI.tab==="trades") return renderTrades();
    if(UI.tab==="profile") return renderProfile();
    if(UI.tab==="pricing") return renderPricing();
    if(UI.tab==="admin" && isCurrentUserAdmin()) return renderAdmin();
    return "";
  }

  // -------- Marketplace / Home --------
  function renderMarket(){
    var f  = UI.filters;
    var cu = currentUser();
    var isSearching = f.q || f.city!=="all" || f.listingType!=="all" || (f.condition && f.condition!=="all") || f.priceMin || f.priceMax || f.sort!=="newest" || f.showTraded;

    // Three-level navigation:
    //   null           → home (parent category tiles)
    //   "parent:<id>"  → subcategory grid for that parent
    //   "cat:<name>"   → items in that subcategory
    if(isSearching || (UI.homeSection && UI.homeSection.indexOf("cat:")===0)){
      return renderMarketResults(f, cu);
    }
    if(UI.homeSection && UI.homeSection.indexOf("parent:")===0){
      return renderSubcategoryGrid(UI.homeSection.replace("parent:",""), cu);
    }
    return renderMarketHome(cu);
  }

  function renderSubcategoryGrid(parentId, cu){
    var parent = parentById(parentId);
    if(!parent) return renderMarketHome(cu);

    // Count available items per subcategory
    var counts = {};
    DB.items.forEach(function(it){
      if(it.ownerId!==UI.currentUserId && it.status==="available"){
        counts[it.category] = (counts[it.category]||0)+1;
      }
    });

    var rows = parent.subs.map(function(sub){
      var ico = CAT_ICONS[sub]||"📦";
      var cnt = counts[sub]||0;
      return '<div class="sub-cat-item" data-action="browse-subcategory" data-sub="'+esc(sub)+'">' +
        '<span class="sub-cat-item-icon">'+ico+'</span>' +
        '<span>'+esc(sub)+'</span>' +
        '<span class="sub-cat-item-count">'+cnt+' ad'+(cnt!==1?'s':'')+'</span>' +
        '<span class="sub-cat-arrow">›</span>' +
      '</div>';
    }).join("");

    var searchBar = renderSearchBar("Search in "+parent.label+"…");

    return searchBar +
      '<button class="btn btn-ghost btn-sm" data-action="clear-home-section" style="margin-bottom:14px;">← All Categories</button>' +
      '<div class="sub-cat-header">' +
        '<span class="sub-cat-parent-icon">'+parent.icon+'</span>' +
        '<span class="sub-cat-parent-label">'+esc(parent.label)+'</span>' +
      '</div>' +
      '<div class="sub-cat-list">'+rows+'</div>';
  }

  function renderMarketHome(cu){
    // ---------- parent category grid (counts roll up from all subcategories) ----------
    var subCounts = {};
    DB.items.forEach(function(it){
      if(it.ownerId!==UI.currentUserId && it.status==="available") subCounts[it.category]=(subCounts[it.category]||0)+1;
    });
    // All categories are barter-eligible — show them all
    var barterTiles = CATEGORY_TREE.map(function(p){
      var total = 0; p.subs.forEach(function(s){ total += (subCounts[s]||0); });
      return '<div class="cat-tile" data-action="browse-category" data-cat="'+esc(p.id)+'">' +
        '<div class="cat-tile-icon" style="background:'+(p.bg||'#F3F4F6')+';">'+
          '<span class="cat-emoji">'+p.icon+'</span>'+
        '</div>' +
        '<div class="cat-tile-label">'+esc(p.label)+'</div>' +
        '<div class="cat-tile-count">'+total+' ad'+(total!==1?'s':'')+'</div>' +
      '</div>';
    }).join("");

    // ---------- featured listings ----------
    var featured = DB.items.filter(function(it){ return it.isFeatured && it.status==="available" && it.ownerId!==UI.currentUserId && !isUserBlocked(it.ownerId, UI.currentUserId); });

    // ---------- recently viewed ----------
    var rvItems = [];
    UI.recentlyViewed.forEach(function(id){
      var it = itemById(id);
      if(it && it.id && it.id!=="__missing__" && it.status==="available" && it.ownerId!==UI.currentUserId && !isUserBlocked(it.ownerId, UI.currentUserId)) rvItems.push(it);
    });

    // ---------- fresh picks (newest) ----------
    var fresh = DB.items.filter(function(it){ return it.status==="available" && it.ownerId!==UI.currentUserId && !isUserBlocked(it.ownerId, UI.currentUserId); });
    fresh.sort(function(a,b){ return b.createdAt-a.createdAt; });
    var freshSlice = fresh.slice(0,8);

    // ---------- nearby ----------
    var nearby = DB.items.filter(function(it){ return it.status==="available" && it.ownerId!==UI.currentUserId && !isUserBlocked(it.ownerId, UI.currentUserId); });
    nearby.sort(function(a,b){ return distanceKm(cu.city,a.city)-distanceKm(cu.city,b.city); });
    var nearbySlice = nearby.slice(0,8);

    var searchBar = renderSearchBar("Search for anything…");

        '</div>' +

    var rvHtml = rvItems.length ? (

    var freshHtml = (

          '<button class="home-see-all" data-action="see-all-fresh">See all</button>' +
        '</div>' +
        '<div class="grid">'+freshSlice.map(renderItemCard).join("")+'</div>' +
      '</div>'
    );

    var nearbyHtml = (
      '<div class="home-section">' +

    // Recent searches
