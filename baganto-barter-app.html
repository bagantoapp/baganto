  function renderMarketResults(f, cu){
    var allItems = DB.items.filter(function(it){ return it.ownerId !== UI.currentUserId; });
    var cat = UI.homeSection ? UI.homeSection.replace("cat:","") : null;

    // Browsing a Jobs / Services / Properties category: type filter doesn't apply
    // (implied by subcategory for properties, not relevant for jobs/services),
    // so ignore any sale/barter/price/condition filter that was left set.
    var noTradeView = !!cat && isNoTrade(cat);
    var propView = !!cat && isProperty(cat);
    if(noTradeView || propView){
      f = {
        q:f.q, category:f.category, city:f.city,
        listingType:"all", condition:"all",
        sort:(f.sort==="price_asc"||f.sort==="price_desc") ? "newest" : f.sort,
        showTraded:f.showTraded, priceMin:"", priceMax:""
      };
    }

    // Expired ads never show in the marketplace, even with "show sold/traded" on
    allItems = allItems.filter(function(it){ return it.status!=="expired"; });
    // Hide ads from people you have blocked
    if(UI.currentUserId) allItems = allItems.filter(function(it){ return !isUserBlocked(it.ownerId, UI.currentUserId); });
    if(!f.showTraded) allItems = allItems.filter(function(it){ return it.status!=="traded" && it.status!=="sold"; });
    if(cat)           allItems = allItems.filter(function(it){ return it.category===cat; });
    if(f.category!=="all") allItems = allItems.filter(function(it){ return it.category===f.category; });
    if(f.city!=="all")     allItems = allItems.filter(function(it){ return it.city===f.city; });
    if(f.listingType==="sale")   allItems = allItems.filter(function(it){ return it.forSale; });
    if(f.listingType==="barter") allItems = allItems.filter(function(it){ return it.forBarter && !isNoBarter(it.category); });
    if(f.condition && f.condition!=="all") allItems = allItems.filter(function(it){ return (it.condition||"good")===f.condition; });
    var pMin = parseFloat(f.priceMin); var pMax = parseFloat(f.priceMax);
    if(!isNaN(pMin) && pMin>=0) allItems = allItems.filter(function(it){ return it.forSale && (it.price||0)>=pMin; });
    if(!isNaN(pMax) && pMax>0)  allItems = allItems.filter(function(it){ return it.forSale && (it.price||0)<=pMax; });
    if(f.q){
      var q=f.q.toLowerCase();
      allItems = allItems.filter(function(it){
        return it.title.toLowerCase().indexOf(q)>=0 || it.description.toLowerCase().indexOf(q)>=0 || (it.wantInExchange||"").toLowerCase().indexOf(q)>=0;
      });
    }

    // Advanced search filters
    var now = nowTs();
    var DAY = 24*60*60*1000;
    if(f.postedDate === "24h") allItems = allItems.filter(function(it){ return (now - it.createdAt) <= 1*DAY; });
    if(f.postedDate === "week") allItems = allItems.filter(function(it){ return (now - it.createdAt) <= 7*DAY; });
    if(f.postedDate === "month") allItems = allItems.filter(function(it){ return (now - it.createdAt) <= 30*DAY; });

    if(f.sellerType === "verified"){
      allItems = allItems.filter(function(it){
        var owner = userById(it.ownerId);
        return owner && owner.isVerified;
      });
    }

    if(f.radius && f.radius > 0){
      allItems = allItems.filter(function(it){
        var dist = distanceKm(cu.city, it.city);
        return dist <= parseInt(f.radius);
      });
    }

    if(f.negotiableOnly){
      allItems = allItems.filter(function(it){ return it.negotiable; });
    }

    // Boosted (paid) ads always come first, then the chosen sort decides the rest
    var boostFirst = function(inner){
      return function(a, b){
        var ba = isBoosted(a) ? 1 : 0, bb = isBoosted(b) ? 1 : 0;
        if(ba !== bb) return bb - ba;
        return inner(a, b);
      };
    };
    if(f.sort==="nearest")   allItems.sort(boostFirst(function(a,b){ return distanceKm(cu.city,a.city)-distanceKm(cu.city,b.city); }));
    else if(f.sort==="views") allItems.sort(boostFirst(function(a,b){ return (b.views||0)-(a.views||0); }));
    else if(f.sort==="price_asc")  allItems.sort(boostFirst(function(a,b){ return (a.price||0)-(b.price||0); }));
    else if(f.sort==="price_desc") allItems.sort(boostFirst(function(a,b){ return (b.price||0)-(a.price||0); }));
    else allItems.sort(boostFirst(function(a,b){ return b.createdAt-a.createdAt; }));

    var cityOpts = '<option value="all">All cities</option>' + CITIES.map(function(c){ return '<option value="'+esc(c.name)+'"'+(f.city===c.name?' selected':'')+'>'+esc(c.name)+'</option>'; }).join("");
    var catOpts  = '<option value="all">All categories</option>' + CATEGORY_TREE.map(function(p){
      var opts = p.subs.map(function(s){ return '<option value="'+esc(s)+'"'+(f.category===s?' selected':'')+'>'+esc(s)+'</option>'; }).join("");
      return '<optgroup label="'+esc(p.label)+'">'+opts+'</optgroup>';
    }).join("") + '<option value="Other"'+(f.category==="Other"?' selected':'')+'>Other</option>';

    // Smart back button label
    var backLabel = "← All Categories";
    if(UI.homeSection && UI.homeSection.indexOf("cat:")===0){
      var par2 = parentOfSub(UI.homeSection.replace("cat:",""));
      if(par2) backLabel = "← "+par2.label;
    }
    var backBtn = (UI.homeSection) ? '<button class="btn btn-ghost btn-sm" data-action="clear-home-section" style="margin-bottom:14px;">'+backLabel+'</button>' : '';
    var heading;
    if(cat){
      var catParent = parentOfSub(cat);
      heading = (CAT_ICONS[cat]||"")+" "+esc(cat) + (catParent ? ' <span style="font-size:13px;font-weight:500;color:var(--muted);">in '+esc(catParent.label)+'</span>' : "");
    } else {
      heading = "Search Results";
    }
    var sub = allItems.length + ' ad' + (allItems.length!==1?'s':'') + ' found';

    var cardsHtml = allItems.length ? '<div class="grid">'+allItems.map(renderItemCard).join("")+'</div>'
      : '<div class="card empty"><div class="empty-icon">🔍</div>No ads match your filters yet.<br>Try adjusting or clearing filters.</div>';

    return '' +
      backBtn +
      renderSearchBar(f.q || "Search for anything…") +
      '<div class="section-title" style="margin-top:10px;">'+heading+'</div>' +
      '<div class="section-sub">'+sub+'</div>' +
      '<div class="toolbar">' +
        (!UI.homeSection ? '<select id="catFilter">'+catOpts+'</select>' : '') +
        '<select id="cityFilter">'+cityOpts+'</select>' +
        // Jobs & Services & Properties: type doesn't apply (implied by subcategory or can't be traded)
        (noTradeView || propView ? '' :
          '<select id="typeFilter">' +
            '<option value="all"'+(f.listingType==="all"?' selected':'')+'>All types</option>' +
            '<option value="sale"'+(f.listingType==="sale"?' selected':'')+'>For Sale</option>' +
            '<option value="barter"'+(f.listingType==="barter"?' selected':'')+'>For Barter</option>' +
          '</select>' +
          '<select id="conditionFilter">' +
            '<option value="all"'+(f.condition==="all"?' selected':'')+'>Any condition</option>' +
            CONDITIONS.map(function(c){
              return '<option value="'+c.id+'"'+(f.condition===c.id?' selected':'')+'>'+esc(c.label)+'</option>';
            }).join("") +
          '</select>') +
        '<select id="postedDateFilter">' +
          '<option value="all"'+(f.postedDate==="all"?' selected':'')+'>Any time</option>' +
          '<option value="24h"'+(f.postedDate==="24h"?' selected':'')+'>Last 24 hours</option>' +
          '<option value="week"'+(f.postedDate==="week"?' selected':'')+'>Last 7 days</option>' +
          '<option value="month"'+(f.postedDate==="month"?' selected':'')+'>Last 30 days</option>' +
        '</select>' +
        '<select id="sellerTypeFilter">' +
          '<option value="all"'+(f.sellerType==="all"?' selected':'')+'>All sellers</option>' +
          '<option value="verified"'+(f.sellerType==="verified"?' selected':'')+'>✓ Verified only</option>' +
        '</select>' +
        '<input type="number" id="radiusFilter" placeholder="Radius (km)" value="'+(f.radius||'')+'" style="width:100px;padding:8px 10px;border-radius:9px;border:1px solid var(--border);">' +
        '<label class="chk"><input type="checkbox" id="negotiableFilter" '+(f.negotiableOnly?'checked':'')+'> Negotiable only</label>' +
        '<select id="sortFilter">' +
          '<option value="newest"'+(f.sort==="newest"?' selected':'')+'>Newest first</option>' +
          '<option value="nearest"'+(f.sort==="nearest"?' selected':'')+'>Nearest</option>' +
          (noTradeView || propView ? '' :
            '<option value="price_asc"'+(f.sort==="price_asc"?' selected':'')+'>Price: Low → High</option>' +
            '<option value="price_desc"'+(f.sort==="price_desc"?' selected':'')+'>Price: High → Low</option>') +
          '<option value="views"'+(f.sort==="views"?' selected':'')+'>Most popular</option>' +
        '</select>' +
        (noTradeView || propView ? '' :
          '<div style="display:flex;gap:6px;align-items:center;"><input type="number" id="priceMin" placeholder="₹ Min" value="'+esc(f.priceMin)+'" style="width:80px;padding:8px 10px;border-radius:9px;border:1px solid var(--border);"><input type="number" id="priceMax" placeholder="₹ Max" value="'+esc(f.priceMax)+'" style="width:80px;padding:8px 10px;border-radius:9px;border:1px solid var(--border);"></div>') +
        '<label class="chk"><input type="checkbox" id="showTraded" '+(f.showTraded?'checked':'')+'> Show sold/traded</label>' +
        '<button class="btn btn-sm btn-ghost" data-action="save-search" style="margin-left:auto;">💾 Save Search</button>' +
      '</div>' +
      renderSavedSearches() +
      cardsHtml;
  }

  function renderSearchBar(placeholder){
    var f = UI.filters;
    return '<div style="margin-bottom:16px;">' +
      '<input type="text" id="searchInput" placeholder="'+esc(placeholder)+'" value="'+esc(f.q)+'" style="width:100%;padding:13px 16px;border-radius:12px;border:1.5px solid var(--border);font-size:15px;background:#fff;">' +
    '</div>';

  function renderSavedSearches(){
    if(!UI.savedSearches || UI.savedSearches.length===0) return '';
    var rows = UI.savedSearches.map(function(s){
      return '<div style="display:flex;gap:8px;align-items:center;padding:8px;background:#F9F9F9;border-radius:6px;border:1px solid var(--border);margin-bottom:6px;">' +
        '<button class="btn btn-xs btn-ghost" data-action="load-search" data-id="'+s.id+'" style="flex:1;text-align:left;">🔖 '+esc(s.name)+'</button>' +
        '<button class="btn btn-xs btn-ghost" data-action="delete-search" data-id="'+s.id+'" style="color:#999;">✕</button>' +
      '</div>';
    }).join('');
    return '<div style="margin-bottom:12px;margin-top:8px;">' +
      '<div style="font-size:13px;color:var(--muted);margin-bottom:6px;">💾 Saved Searches:</div>' +
      rows +
    '</div>';
  }

  function renderItemCard(it){
    var owner  = userById(it.ownerId);
    var dist   = distanceKm(currentUser().city, it.city);
    var rating = userRating(owner.id);
    var saved  = isSaved(it.id);
    var modeBadges = (it.forSale ? (isProperty(it.category)
        ? '<span class="pill pill-sale">'+(isRental(it.category)?'For Rent':'For Sale')+'</span>'
        : '<span class="pill pill-sale">Sale</span>') : '') +
      (it.forBarter && !isNoBarter(it.category) ? '<span class="pill pill-barter">Barter</span>' : '');
    var priceLine = '';
    if(it.forSale){
      if((it.price||0)===0){
        priceLine = '<div class="item-price free-price">FREE</div>';
      } else {
        priceLine = '<div class="item-price">'+formatINR(it.price)+(isRental(it.category)?'<span class="per-month">/month</span>':'')+(it.negotiable?' <span class="negotiable-tag">Negotiable</span>':'')+'</div>';
      }
    }
    var wantLine   = (it.forBarter && !isNoBarter(it.category)) ? '<div class="item-want">Wants: '+esc(it.wantInExchange||"Open to offers")+'</div>' : '';
    var viewCount  = '<span class="view-count">👁 '+(it.views||0)+'</span>';
    var ribbon     = isBoosted(it) ? '<div class="featured-ribbon">⚡ Boosted</div>' : (it.isFeatured ? '<div class="featured-ribbon">⭐ Featured</div>' : '');
    var premiumBadge = isPremium(it) ? '<span class="pill" style="background:#ede9fe;color:#5b21b6;">👑 Premium</span>' : '';
    var heartBtn   = '<button class="heart-btn '+(saved?'saved':'')+'" data-action="toggle-save" data-id="'+it.id+'" title="'+(saved?'Remove from saved':'Save ad')+'">'+(saved?'❤️':'🤍')+'</button>';
    var photoDisplay = (it.photos && it.photos.length) ? '<div style="width:100%;height:160px;background-size:cover;background-position:center;border-radius:6px;margin-bottom:8px;background-image:url('+it.photos[0]+');"></div>' : '<div class="item-icon">'+it.icon+'</div>';
    return '' +
      '<div class="card item-card" data-action="open-item" data-id="'+it.id+'">' +
        ribbon +
        heartBtn +
        photoDisplay +
        '<div class="item-title">'+esc(it.title)+'</div>' +
        '<div class="item-meta">'+'<span class="pill pill-cat">'+esc(it.category)+'</span>'+statusPillForItem(it.status)+modeBadges+premiumBadge+'</div>' +
        priceLine +
        wantLine +
        '<div class="item-owner">'+avatarOf(owner, 18)+' '+esc(owner.name)+' '+getSellerBadge(owner.id)+' · '+esc(it.city)+(dist>0?' · '+dist+' km':'')+(rating.count?' · <span class="stars">★</span> '+rating.avg.toFixed(1):'')+' '+viewCount+'</div>' +
      '</div>';
  }

  // -------- Chats (OLX inbox style) --------
  function renderTrades(){
    // Build a unified inbox: one row per deal, sorted by last activity
    var myDeals = DB.deals.filter(function(d){
      return d.fromUserId===UI.currentUserId || d.toUserId===UI.currentUserId;
    });

    // Apply filter
    var cf = UI.chatsFilter;
    if(cf!=="all") myDeals = myDeals.filter(function(d){ return d.kind===cf; });

    // Sort by last message or creation
    myDeals.sort(function(a,b){
      var msgsA = messagesFor(a.id);
      var msgsB = messagesFor(b.id);
      var tA = msgsA.length ? msgsA[msgsA.length-1].createdAt : a.createdAt;
      var tB = msgsB.length ? msgsB[msgsB.length-1].createdAt : b.createdAt;
      return tB - tA;
    });

    var unreadCount = myDeals.filter(function(d){ return d.status==="pending" && d.toUserId===UI.currentUserId; }).length;

    var rows = myDeals.map(function(d){
      var cpId = d.fromUserId===UI.currentUserId ? d.toUserId : d.fromUserId;
      var cp   = userById(cpId);
      var msgs = messagesFor(d.id);
      var last = msgs.length ? msgs[msgs.length-1] : null;
      var isIncoming = d.toUserId===UI.currentUserId;
      var isUnread = d.status==="pending" && isIncoming;

      var itemLabel = "";
      if(d.kind==="barter"){
        var reqItem = itemById(d.requestedItemId);
        itemLabel = offeredLabel(d)+" ⇄ "+reqItem.icon+" "+esc(reqItem.title);
      } else if(d.kind==="sale" || d.kind==="offer"){
        var saleItem = itemById(d.itemId);
        itemLabel = saleItem.icon+" "+esc(saleItem.title);
      } else if(d.kind==="query"){
        var qItem = itemById(d.itemId);
        itemLabel = qItem.icon+" "+esc(qItem.title);
      }

      var lastHasPhoto = !!(last && last.photos && last.photos.length);
      var preview = last
        ? (last.text ? (lastHasPhoto ? "📷 " : "") + esc(last.text) : (lastHasPhoto ? "📷 Photo" : ""))
        : (isIncoming ? "New enquiry" : "Awaiting reply");
      var kindIcon = d.kind==="barter"?"🔄":d.kind==="sale"?"🛒":d.kind==="offer"?"💬":"❓";
      var statusPill = statusPillFor(d.status);

      var showTag = (d.status==="pending" || d.status==="accepted" || d.status==="completed");
      var tagText = d.status==="completed" ? "Done" : (d.status==="accepted" ? "Accepted" : "Awaiting reply");
      return '<div class="chat-row'+(isUnread?' unread':'')+'" data-action="open-deal" data-id="'+d.id+'">' +
        '<div class="chat-avatar">'+avatarOf(cp, 40)+'</div>' +
        '<div class="chat-info">' +
          '<div class="chat-top"><span class="chat-name">'+esc(cp.name)+'</span>' +
            (showTag ? '<span class="chat-tag">'+kindIcon+' '+esc(tagText)+'</span>' : '') +
          '</div>' +
          '<div class="chat-item">'+itemLabel+'</div>' +
          '<div class="chat-preview">'+preview+'</div>' +
        '</div>' +
        '<div class="chat-side">' +
          '<span class="chat-time">'+timeAgo(last ? last.createdAt : d.createdAt)+'</span>' +
          (isUnread ? '<span class="chat-unread" title="Unread"></span>' : '') +
        '</div>' +
      '</div>';
    }).join("");

    var emptyHtml = '<div class="card empty"><div class="empty-icon">💬</div>No chats yet.<br>Browse the marketplace and make an enquiry!</div>';

    var filterBar = '' +
      '<div class="chat-filters">' +
        ['all','barter','sale','offer','query'].map(function(k){
          var labels = {all:"All",barter:"Barter",sale:"Purchases",offer:"Offers",query:"Enquiries"};
          return '<button class="chat-chip'+(UI.chatsFilter===k?" active":"")+'" data-action="chats-filter" data-val="'+k+'">'+labels[k]+'</button>';
        }).join("") +
      '</div>';

    return '' +
      '<div class="section-title">Chats</div>' +
      '<div class="section-sub">'+(unreadCount>0?unreadCount+' unread · ':'')+myDeals.length+' conversation'+(myDeals.length!==1?'s':'')+'</div>' +
      filterBar +
      (myDeals.length ? '<div class="card" style="padding:0;overflow:hidden;"><div class="chat-list">'+rows+'</div></div>' : emptyHtml);
  }

  function statusPillFor(status){
    var map = {pending:"pill-pending", accepted:"pill-accepted", completed:"pill-completed", rejected:"pill-rejected", withdrawn:"pill-withdrawn"};
    var label = status.charAt(0).toUpperCase()+status.slice(1);
    return '<span class="pill '+(map[status]||"pill-pending")+'">'+label+'</span>';
  }

  // -------- Modals --------
  function renderModal(){
    if(!UI.modal) return "";
    var m = UI.modal;
    if(m.type==="item")    return modalWrap("Ad Details", renderItemModalBody(m.itemId));
    if(m.type==="propose") return modalWrap("Propose a Trade", renderProposeModalBody(m.itemId));
    if(m.type==="buy")     return modalWrap("Confirm Purchase", renderBuyModalBody(m.itemId));
    if(m.type==="offer")   return modalWrap("Make an Offer", renderOfferModalBody(m.itemId));
    if(m.type==="report")  return modalWrap("Report Ad", renderReportModalBody(m.itemId));
    if(m.type==="trade"){
      var d = findDeal(m.dealId);
      var title = (d && d.kind==="sale") ? "Purchase Details" : (d && d.kind==="offer") ? "Offer Details" : "Trade Details";
      return modalWrap(title, renderTradeModalBody(m.dealId));
    }
    if(m.type==="rate") return modalWrap("Rate This Trade", renderRateModalBody(m.dealId, m.toUserId));
    if(m.type==="id-verification") return modalWrap("🆔 ID Verification (Pro Seller)", renderIdVerificationModalBody());
    return "";
  }

  function modalWrap(title, bodyHtml){
    return '<div class="modal-overlay" data-action="close-modal-overlay">' +
      '<div class="modal-box" data-stop="1">' +
        '<div class="modal-head"><h3>'+esc(title)+'</h3><button class="modal-close" data-action="close-modal">✕</button></div>' +
        '<div class="modal-body">'+bodyHtml+'</div>' +
      '</div>' +
    '</div>';
  }

  function renderItemModalBody(itemId){
    var it    = itemById(itemId);
    var owner = userById(it.ownerId);
    var rating= userRating(owner.id);
    var dist  = distanceKm(currentUser().city, it.city);
    var isMine= it.ownerId === UI.currentUserId;
    var saved = isSaved(it.id);
    var modeBadges = (it.forSale ? '<span class="pill pill-sale">'+(isRental(it.category)?'For Rent':'For Sale')+'</span>' : '') + (it.forBarter && !isNoBarter(it.category) ? '<span class="pill pill-barter">For Barter</span>' : '');
    var galleryHtml = (it.photos && it.photos.length) ?
      '<div class="modal-gallery">' + it.photos.map(function(src){ return '<img src="'+src+'" alt="">'; }).join("") + '</div>' :
      '<div class="modal-icon-big">'+it.icon+'</div>';
    var priceLine = '';
    if(it.forSale){
      if((it.price||0)===0){
        priceLine = '<div class="item-price free-price" style="margin-bottom:6px;">FREE</div>';
      } else {
        priceLine = '<div class="item-price" style="margin-bottom:6px;">'+formatINR(it.price)+(it.negotiable?' <span class="negotiable-tag">Negotiable</span>':'')+'</div>';
      }
    }
    var wantLine = (it.forBarter && !isNoBarter(it.category)) ? '<div class="item-want" style="margin-bottom:14px;">Wants in exchange: '+esc(it.wantInExchange||"Open to offers")+'</div>' : '';
    var viewLine = '<span class="view-count" style="font-size:13px;">👁 '+(it.views||0)+' views</span>';

    // member since
    var memberSince = owner.memberSince ? new Date(owner.memberSince).getFullYear() : '';
    var memberLine = memberSince ? '<span class="member-since">Member since '+memberSince+'</span>' : '';

    var actionHtml = "";
    if(isMine){
      actionHtml = '<div class="muted" style="margin-bottom:8px;">This is your own listing.</div>';
    } else if(it.status!=="available"){
      actionHtml = '<div class="muted">This item is no longer available.</div>';
    } else {
      var parts = [];
      if(it.forSale && (it.price||0)>0 && !isProperty(it.category)){
        parts.push('<button class="btn btn-primary btn-block" data-action="open-buy" data-id="'+it.id+'">Buy Now - '+formatINR(it.price)+'</button>');
      }
      if(it.forSale && it.negotiable && (it.price||0)>0 && !isRental(it.category)){
        parts.push('<button class="btn btn-block" data-action="open-offer" data-id="'+it.id+'">💬 Make an Offer</button>');
      }
      if(it.forSale && (it.price||0)===0){
        parts.push('<button class="btn btn-primary btn-block" data-action="open-buy" data-id="'+it.id+'">Claim for Free</button>');
      }
      if(it.forBarter && !isNoBarter(it.category)){
        if(hasPendingProposalOnItem(UI.currentUserId, it.id)){

  function renderSimilarAds(excludeId, category){
    var similar = DB.items.filter(function(it){
      return it.id!==excludeId && it.category===category && it.status==="available" && it.ownerId!==UI.currentUserId;
    });
    if(!similar.length) return "";
    // Sort by views desc, take top 4
    similar.sort(function(a,b){ return (b.views||0)-(a.views||0); });
    var cards = similar.slice(0,4).map(function(it){
      var priceLabel = it.forSale ? ((it.price||0)===0 ? "FREE" : formatINR(it.price)) : "Barter";
      return '<div class="similar-card" data-action="open-item" data-id="'+it.id+'">' +
        '<div class="similar-icon">'+it.icon+'</div>' +
        '<div class="similar-title">'+esc(it.title)+'</div>' +
        '<div class="similar-price">'+priceLabel+'</div>' +
        '<div class="similar-city">'+esc(it.city)+'</div>' +
      '</div>';
    }).join("");
    return '<div class="similar-section"><div class="similar-section-title">🔍 Similar Ads</div><div class="similar-grid">'+cards+'</div></div>';
  }

  // The full WhatsApp-style chat thread — shared by every kind of deal
  // (barter, purchase, offer and enquiry) so photos can be sent in all of them.
  function renderChatThread(d, counterparty){
    var msgs = messagesFor(d.id);

    // Timestamp of the last message the other person sent — anything of mine
    // before it has certainly been seen, which drives the ✓✓ ticks.
    var theirLastTs = 0;
    msgs.forEach(function(m){ if(m.senderId!==UI.currentUserId && m.createdAt>theirLastTs) theirLastTs = m.createdAt; });

    var msgsHtml = msgs.map(function(m, i){
      var mine = m.senderId===UI.currentUserId;
      var prev = i>0 ? msgs[i-1] : null;
      var out = "";
      if(!prev || !sameDay(prev.createdAt, m.createdAt)){
        out += '<div class="chat-day">'+esc(chatDayLabel(m.createdAt))+'</div>';
      }
      var grouped = !!(prev && prev.senderId===m.senderId && sameDay(prev.createdAt, m.createdAt) &&
                       (m.createdAt - prev.createdAt) < 5*60*1000);
      var imgs = (m.photos && m.photos.length) ? m.photos.map(function(src){
        return '<img class="msg-img" src="'+src+'" alt="Shared photo" data-action="view-chat-photo" data-src="'+src+'">';
      }).join("") : "";
      var body = imgs + (m.text ? esc(m.text) : "");
      var seen = mine && theirLastTs > m.createdAt;
      var tick = mine ? '<span class="msg-tick'+(seen?' seen':'')+'">'+(seen?'✓✓':'✓')+'</span>' : '';
      out += '<div class="msg '+(mine?'msg-me':'msg-them')+(grouped?' grouped':'')+'">' + body +
        '<span class="msg-time">'+esc(formatClock(m.createdAt))+tick+'</span></div>';
      return out;
    }).join("");

    var typingUsers = getTypingUsers(d.id);
    var typingHtml = typingUsers.length ? '<div class="chat-typing">'+esc(typingUsers.join(", "))+' is typing…</div>' : '';

    var emptyThread = '<div class="chat-day">Today</div>' +
      '<div class="muted" style="align-self:center;font-size:12.5px;text-align:center;padding:14px 0;">No messages yet — say hello!</div>';

    return '' +
      '<div class="chat-head">' +
        '<div class="chat-head-av">'+avatarOf(counterparty, 34)+'</div>' +
        '<div style="flex:1;min-width:0;">' +
          '<div class="chat-head-name">'+esc(counterparty.name)+' '+getSellerBadge(counterparty.id)+'</div>' +
          '<div class="chat-head-sub">'+dealItemLine(d)+'</div>' +
        '</div>' +
        statusPillFor(d.status) +
      '</div>' +
      '<div class="chat-thread">' +
        '<div class="chat-box">'+(msgsHtml || emptyThread)+typingHtml+'</div>' +
        renderChatImageStrip() +
        '<form data-form="send-message" data-id="'+d.id+'" class="chat-input-row">' +
          '<label class="chat-attach" title="Send a photo">📎' +
            '<input type="file" id="chatImgInput" accept="image/*" multiple>' +
          '</label>' +
          '<input type="text" id="msgInput_'+d.id+'" name="text" placeholder="Type a message…" autocomplete="off" data-dealid="'+d.id+'">' +
          '<button class="chat-send" type="submit" title="Send" aria-label="Send">&#10148;</button>' +
        '</form>' +
      '</div>';
  }

  function renderTradeModalBody(dealId){
    var d = findDeal(dealId);
    if(!d) return '<div class="muted">This deal no longer exists.</div>';
    var counterpartyId = (d.fromUserId===UI.currentUserId) ? d.toUserId : d.fromUserId;
    var counterparty = userById(counterpartyId);

    if(d.kind==="sale"){
      var it = itemById(d.itemId);
      var isBuyer = d.fromUserId===UI.currentUserId;
      var roleLine = isBuyer ? ("You bought this from " + esc(counterparty.name) + ".") : ("You sold this to " + esc(counterparty.name) + ".");
      var actionsS = "";
      var existingS = ratingByFrom(d.id, UI.currentUserId);
      if(existingS){
        actionsS = '<div class="muted">You rated this '+(isBuyer?'seller':'buyer')+': <span class="stars">'+starsStr(existingS.stars)+'</span></div>';
      } else {
        actionsS = '<button class="btn btn-primary btn-sm" data-action="open-rate" data-id="'+d.id+'" data-to="'+counterpartyId+'">Rate '+esc(counterparty.name)+'</button>';
      }
      return '' +
        '<div class="muted" style="margin-bottom:12px;font-size:13px;">'+roleLine+'</div>' +
        renderChatThread(d, counterparty) +
        '<div style="margin-top:14px;">'+actionsS+'</div>';
    }

    var isIncoming = d.toUserId === UI.currentUserId;

    var actions = "";
    if(d.status==="pending" && isIncoming){
      actions = '<button class="btn btn-primary btn-sm" data-action="accept-deal" data-id="'+d.id+'">Accept</button> ' +
                '<button class="btn btn-danger btn-sm" data-action="reject-deal" data-id="'+d.id+'">Decline</button>';
    } else if(d.status==="pending" && !isIncoming){
      actions = '<button class="btn btn-danger btn-sm" data-action="withdraw-deal" data-id="'+d.id+'">Withdraw Proposal</button>';
    } else if(d.status==="accepted"){
      actions = '<button class="btn btn-primary btn-sm" data-action="complete-deal" data-id="'+d.id+'">Mark Trade Complete</button>';
    } else if(d.status==="completed"){
      var existing = ratingByFrom(d.id, UI.currentUserId);
      if(existing){
        actions = '<div class="muted">You rated this trade: <span class="stars">'+starsStr(existing.stars)+'</span></div>';
      } else {
        actions = '<button class="btn btn-primary btn-sm" data-action="open-rate" data-id="'+d.id+'" data-to="'+counterpartyId+'">Rate '+esc(counterparty.name)+'</button>';
      }
    } else {
      actions = '<div class="muted">This proposal is '+d.status+'.</div>';
    }

    return renderChatThread(d, counterparty) +
      '<div style="margin-top:14px;">'+actions+'</div>';
  }

  // ---------------- Event wiring ----------------
  function onClick(e){
    var overlay = e.target.closest && e.target.closest('[data-action="close-modal-overlay"]');
    if(overlay && e.target===overlay){ UI.modal=null; UI.chatImages=[]; UI.chatPhotoView=null; render(); return; }

    var t = e.target.closest("[data-action]");

    // Close the notification panel when clicking anywhere outside it.
    // If the click also hit an action, that handler's own render() will repaint.
    if(UI.notifOpen && !(e.target.closest && e.target.closest(".notif-wrap"))){
      UI.notifOpen = false;
      if(!t){ render(); return; }
    }

    if(!t) return;
    var action = t.dataset.action;

    if(action==="goto-tab"){
        var dest=t.dataset.tab;
        if(!UI.currentUserId && dest!=="market" && dest!=="pricing"){
          UI.authScreen=true; UI.authPage="login"; UI.authReturnTab=dest; render(); return;
        }
        if(dest==="market") UI.homeSection=null;
        UI.tab=dest; UI.modal=null; UI.legalPage=null; render(); return;
      }
    if(action==="close-modal"){ UI.modal=null; UI.chatPhotoView=null; UI.chatImages=[]; render(); return; }
    // ---- Chat photo attachments ----
    if(action==="remove-chat-img"){
      var rIdx = parseInt(t.dataset.idx, 10);
      UI.chatImages = (UI.chatImages||[]).filter(function(_, i){ return i!==rIdx; });
      if(!refreshChatImageStrip()) render();
      return;
    }
    if(action==="view-chat-photo"){
      UI.chatPhotoView = t.dataset.src || null;
      render(); return;
    }
    if(action==="close-photo-view"){ UI.chatPhotoView = null; render(); return; }

  function onChange(e){
    // Live-toggle barter label when category changes inside a listing form
    if(e.target.name==="category"){
      var form2 = e.target.closest ? e.target.closest("form") : null;
      if(form2){
        // Track the selected category in UI state for the add-listing form
        // so render() preserves it if called again
        if(form2.dataset.form==="add-listing"){
          UI.newListingCategory = e.target.value;
        }
        var bl = form2.querySelector("#barterLabel");
        var bc = form2.querySelector("#forBarterCheck");
        var wr = form2.querySelector("#wantRow");
        var sc = form2.querySelector('[name="forSale"]');
        var pr = form2.querySelector("#priceRow");
        var mr = form2.querySelector("#modeRow");
        var ntr= form2.querySelector("#noTradeRow");
        var ntn= form2.querySelector("#noTradeNote");
        var pRow= form2.querySelector("#propRow");
        var pNote=form2.querySelector("#propNote");
        var pLab= form2.querySelector("#priceLabel");
        var cRow= form2.querySelector("#conditionRow");
        var priceInput = form2.querySelector('[name="price"]');
        var noTradeNow = isNoTrade(e.target.value);
        var propNow    = isProperty(e.target.value);
        var rentNow    = isRental(e.target.value);

        // Jobs & Services: no sale, no barter - hide the whole offer block
        // Properties: sale/rent is implied by the subcategory, so don't ask
        if(mr)   mr.style.display   = (noTradeNow || propNow) ? "none" : "";
        if(ntr)  ntr.style.display  = noTradeNow ? "" : "none";
        if(pRow) pRow.style.display = propNow ? "" : "none";
        if(cRow) cRow.style.display = propNow ? "none" : "";

        if(noTradeNow){
          if(ntn) ntn.textContent = "This is a " + noTradeKind(e.target.value) + " listing - it is not for sale or barter. People can message you to enquire.";
          if(sc){ sc.checked = false; }
          if(bc){ bc.checked = false; }
          if(pr) pr.style.display = "none";
          if(wr) wr.style.display = "none";
        } else if(propNow){
          if(pNote) pNote.textContent = rentNow
            ? "This is a rental listing - enter the monthly rent below."
            : "This is a sale listing - enter the asking price below.";
          if(sc){ sc.checked = true; }
          if(bc){ bc.checked = false; }
          if(wr) wr.style.display = "none";
          if(pr) pr.style.display = "";
          if(pLab) pLab.innerHTML = priceLabelFor(e.target.value);
          if(priceInput) priceInput.placeholder = rentNow ? "e.g. 25000" : "e.g. 4500000";
        }

        if(bl && !noTradeNow && !propNow){
          var noBarter = isNoBarter(e.target.value);
          bl.style.display = noBarter ? "none" : "";
          if(noBarter && bc){ bc.checked = false; if(wr) wr.style.display="none"; }
          else if(bc && bc.checked && wr){ wr.style.display = ""; }
          if(pLab) pLab.innerHTML = priceLabelFor(e.target.value) + ' <small style="color:var(--muted);">Enter 0 for FREE</small>';
          if(priceInput) priceInput.placeholder = "e.g. 1500";
          if(pr) pr.style.display = (sc && sc.checked) ? "" : "none";
        }
      }
    }
    if(e.target.id==="catFilter"){   UI.filters.category    = e.target.value; render(); return; }
    if(e.target.id==="cityFilter"){  UI.filters.city        = e.target.value; render(); return; }
    if(e.target.id==="typeFilter"){  UI.filters.listingType = e.target.value; render(); return; }
    if(e.target.id==="conditionFilter"){ UI.filters.condition = e.target.value; render(); return; }
    if(e.target.id==="postedDateFilter"){ UI.filters.postedDate = e.target.value; render(); return; }
    if(e.target.id==="sellerTypeFilter"){ UI.filters.sellerType = e.target.value; render(); return; }
    if(e.target.id==="negotiableFilter"){ UI.filters.negotiableOnly = e.target.checked; render(); return; }
    if(e.target.id==="sortFilter"){  UI.filters.sort        = e.target.value; render(); return; }
    if(e.target.id==="showTraded"){  UI.filters.showTraded  = e.target.checked; render(); return; }
    if(e.target.id==="priceMin"){    UI.filters.priceMin    = e.target.value; render(); return; }
    if(e.target.id==="priceMax"){    UI.filters.priceMax    = e.target.value; render(); return; }
    if(e.target.dataset && e.target.dataset.action==="switch-user"){
      UI.currentUserId = e.target.value;
      storageSet(USER_KEY, UI.currentUserId);
      UI.modal = null;
      render();
      return;
    }
  }

  function onSubmit(e){
    var form = e.target.closest("form[data-form]");
    if(!form) return;
    e.preventDefault();
    var type = form.dataset.form;

    if(type==="add-listing"){
      var fd = new FormData(form);
      var catA = fd.get("category")||"";
      var noTradeA = isNoTrade(catA);
      var propA    = isProperty(catA);
      var forSale = !noTradeA && (propA || !!fd.get("forSale"));
      var forBarter = !noTradeA && !propA && !!fd.get("forBarter") && !isNoBarter(catA);
      if(!noTradeA && !propA && !forSale && !forBarter){ showToast("Choose at least one: list for sale, or open to barter."); return; }
      var price = null;
      if(forSale){
        var rawPrice = fd.get("price");
        price = rawPrice !== null && rawPrice !== "" ? parseFloat(rawPrice) : null;
        if(price === null || isNaN(price) || price < 0){ showToast("Enter a price (use 0 for free)."); return; }
        if(propA && price <= 0){ showToast(isRental(catA) ? "Enter the monthly rent." : "Enter the asking price."); return; }
      }
      var newCat = fd.get("category") || "Other";
      var addOk = addListing({
        title: fd.get("title") || "",
        category: newCat,
        description: fd.get("description") || "",
        forSale: forSale,
        price: forSale ? price : null,
        negotiable: forSale ? !!fd.get("negotiable") : false,
        forBarter: forBarter,
        wantInExchange: forBarter ? (fd.get("wantInExchange") || "") : "",
        city: fd.get("city") || currentUser().city,
        condition: fd.get("condition") || "good",
        icon: getCategoryIcon(newCat),
        photos: (UI.newListingImages || [])
      });
      if(addOk===false){ render(); window.scrollTo(0,0); return; }
      UI.listingFormOpen = false;
      UI.newListingImages = [];
      render();
      return;
    }
    if(type==="propose-trade"){
      var fd2 = new FormData(form);
      var offId = fd2.get("offeredItemId") || "";
      var offTxt = (fd2.get("offeredText") || "").trim();
      if(offId === "__custom__" && !offTxt){
        // Inline error only — a toast would re-render and wipe the form
        var errP = document.getElementById("proposeError");
        if(errP){ errP.textContent = "Describe the item you're offering."; errP.style.display = ""; }
        var oti = document.getElementById("offeredTextInput");
        if(oti){ try{ oti.focus(); }catch(e){} }
        return;
      }
      createBarterProposal(form.dataset.requested, offId, fd2.get("message"), (UI.chatImages||[]), offTxt);
      UI.chatImages = [];
      UI.modal = null;
      UI.tab = "trades";
      render();
      return;
    }
    if(type==="send-message"){
      var fd3 = new FormData(form);
      var msgText = fd3.get("text") || "";
      var msgPhotos = (UI.chatImages || []);
      if(!String(msgText).trim() && !msgPhotos.length){ return; }
      sendMessage(form.dataset.id, msgText, msgPhotos);
      UI.chatImages = [];
      render();
      return;
    }
    if(type==="rate-trade"){
      var fd4 = new FormData(form);
      var stars = parseInt(fd4.get("stars")||"5", 10);
      submitRating(form.dataset.id, form.dataset.to, stars, fd4.get("review"));
      UI.modal = null;
      render();
      return;
    }
    if(type==="create-profile"){
      var fd5 = new FormData(form);
      var created = createProfile({
        name: fd5.get("name") || "",
        city: fd5.get("city") || CITIES[0].name,
        avatar: fd5.get("avatar") || AVATARS[0]
      });
      if(created){ UI.profileFormOpen = false; }
      render();
      return;
    }
    if(type==="edit-listing"){
      var fdE = new FormData(form);
      var catE = fdE.get("category")||"";
      var noTradeE = isNoTrade(catE);
      var propEE   = isProperty(catE);
      var forSaleE = !noTradeE && (propEE || !!fdE.get("forSale"));
      var forBarterE = !noTradeE && !propEE && !!fdE.get("forBarter") && !isNoBarter(catE);
      if(!noTradeE && !propEE && !forSaleE && !forBarterE){ showToast("Choose at least one: for sale or for barter."); return; }
      var priceE = forSaleE ? parseFloat(fdE.get("price")||"0") : null;
      if(forSaleE && (priceE===null || isNaN(priceE) || priceE<0)){ showToast("Enter a valid price (0 for free)."); return; }
      var editingItem = itemById(form.dataset.id);
      var allPhotos = (editingItem.photos||[]).concat(UI.newListingImages||[]);
      var editCat = fdE.get("category")||"Other";
      saveEditedListing(form.dataset.id, {
        title: fdE.get("title")||"",
        category: editCat,
        city: fdE.get("city")||currentUser().city,
        description: fdE.get("description")||"",
        forSale: forSaleE,
        price: forSaleE ? priceE : null,
        negotiable: forSaleE ? !!fdE.get("negotiable") : false,
        forBarter: forBarterE,
        wantInExchange: forBarterE ? (fdE.get("wantInExchange")||"") : "",
        condition: fdE.get("condition")||"good",
        icon: getCategoryIcon(editCat),
        photos: allPhotos.slice(0, 5)
      });
      UI.listingFormOpen = false;
      UI.editingItemId = null;
      render();
      return;
    }
    if(type==="make-offer"){
      var fdO = new FormData(form);
      var offerPrice = parseFloat(fdO.get("offerPrice"));
      if(!(offerPrice>0)){ showToast("Enter a valid offer amount."); return; }
      makeOffer(form.dataset.id, offerPrice, fdO.get("message")||"", (UI.chatImages||[]));
      UI.chatImages = [];
      UI.modal = null;
      UI.tab = "trades";
      render();
      return;
    }
    if(type==="report-ad"){
      var fdR = new FormData(form);
      var reason = fdR.get("reason") || REPORT_REASONS[0];
      var details = fdR.get("details") || "";
      reportItem(form.dataset.id, reason, details);
      UI.modal = null;
      showToast("✅ Report submitted. Thank you for keeping Baganto safe!");
      render();
      return;
    }
    if(type==="auth-login"){
      var fdL = new FormData(form);
      var emailOrPhone = (UI.loginMode==="email") ? (fdL.get("email")||"").trim() : (fdL.get("phone")||"").trim();
      var pass  = (fdL.get("password")||"").trim();
      var errEl = document.getElementById("authError");
      var match = null;
      if(UI.loginMode==="email"){
        match = DB.users.filter(function(u){ return u.email===emailOrPhone && checkPassword(u, pass); })[0];
      } else {
        match = DB.users.filter(function(u){ return u.phone===emailOrPhone && checkPassword(u, pass); })[0];
      }
      if(!match){
        if(errEl) errEl.textContent = "Incorrect "+UI.loginMode+" or password.";
        return;
      }
      // Direct login — no OTP step
      UI.currentUserId = match.id;
      UI.authScreen    = false;
      storageSet(USER_KEY, match.id);
      if(UI.authReturnAction==="start-sell"){
        UI.authReturnAction=null; UI.tab="listings"; UI.listingFormOpen=true; UI.newListingCategory="";
      } else if(UI.authReturnTab){
        UI.tab=UI.authReturnTab; UI.authReturnTab=null;
      }
      render();
      return;
    }
    if(type==="auth-signup"){
      var fdS = new FormData(form);
      var sName  = (fdS.get("fullname")||"").trim();
      var sEmail = (fdS.get("email")||"").trim();
      var sPhone = (fdS.get("phone")||"").trim();
      var sCity  = fdS.get("city") || CITIES[0].name;
      var sPass  = (fdS.get("password")||"").trim();
      var sErr   = document.getElementById("authError");
      if(!sName){ if(sErr) sErr.textContent="Enter your name."; return; }
      if(!sEmail || !/^[^@]+@[^@]+\.[^@]+$/.test(sEmail)){ if(sErr) sErr.textContent="Enter a valid email address."; return; }
      if(!/^[6-9]\d{9}$/.test(sPhone)){ if(sErr) sErr.textContent="Enter a valid 10-digit mobile number."; return; }
      if(sPass.length < 6){ if(sErr) sErr.textContent="Password must be at least 6 characters."; return; }
      if(DB.users.filter(function(u){ return u.phone===sPhone; }).length){
        if(sErr) sErr.textContent="That phone number is already registered."; return;
      }
      if(DB.users.filter(function(u){ return u.email===sEmail; }).length){
        if(sErr) sErr.textContent="That email is already registered."; return;
      }
      var newUser = {
        id: uid("u"), name: sName, phone: sPhone, email: sEmail,
        city: sCity, avatar: AVATARS[Math.floor(Math.random()*AVATARS.length)],
        memberSince: nowTs()
      };
      setUserPassword(newUser, sPass);   // stored as a salted hash, never plain
      DB.users.push(newUser);
      migrateDB(DB);
      saveDB();
      UI.currentUserId = newUser.id;
      UI.authScreen    = false;
      storageSet(USER_KEY, newUser.id);
      if(UI.authReturnAction==="start-sell"){
        UI.authReturnAction=null; UI.tab="listings"; UI.listingFormOpen=true; UI.newListingCategory="";
      } else if(UI.authReturnTab){
        UI.tab=UI.authReturnTab; UI.authReturnTab=null;
      }
      render();
      return;
    }
    if(type==="auth-forgot-password"){
      var fd = new FormData(form);
      var emailOrPhone = (fd.get("emailOrPhone")||"").trim();
      var errEl = document.getElementById("authError");
      if(!emailOrPhone){ if(errEl) errEl.textContent="Enter email or phone."; return; }
      // Check if user exists
      var match = DB.users.filter(function(u){ 
        return u.email===emailOrPhone || u.phone===emailOrPhone; 
      })[0];
      if(!match){
        if(errEl) errEl.textContent="No account found with that email or phone."; return;
      }
      // Generate demo OTP
      var demoOtp = "654321";
      UI.otpSent = true;
      UI.otpVerifyMode = "forgot-password";
      UI.tempForgotUserId = match.id;
      UI.tempForgotOtp = demoOtp;
      if(errEl) errEl.innerHTML = '<span style="color:#16a34a;">✓ Reset code sent! Demo OTP: '+demoOtp+'</span>';
      UI.authPage = "otp-verify";
      render();
      return;
    }
    if(type==="auth-reset-password"){
      var fdR = new FormData(form);
      var np = (fdR.get("newPassword")||"").trim();
      var cp = (fdR.get("confirmPassword")||"").trim();
      var errR = document.getElementById("authError");
      if(!np){ if(errR) errR.textContent="Enter a new password."; return; }
      if(np.length < 5){ if(errR) errR.textContent="Password must be at least 5 characters."; return; }
      if(np !== cp){ if(errR) errR.textContent="Passwords do not match."; return; }
      var target = userById(UI.tempForgotUserId);
      if(!target || !target.id || target.name==="Unknown User"){
        if(errR) errR.textContent="Session expired. Start the reset again.";
        UI.authPage="forgot-password"; render(); return;
      }
      setUserPassword(target, np);
      UI.tempForgotUserId = null;
      UI.tempForgotOtp = null;
      UI.otpSent = false;
      UI.otpVerifyMode = null;
      UI.loginPassDraft = "";
      UI.authPage = "login";
      saveDB();
      showToast("Password updated. Log in with your new password.");
      render();
      return;
    }
    if(type==="auth-otp-verify"){
      var fd = new FormData(form);
      var otp = (fd.get("otp")||"").trim();
      var errEl = document.getElementById("authError");
      if(!otp){ if(errEl) errEl.textContent="Enter the OTP."; return; }
      if(UI.otpVerifyMode==="login"){
        if(otp !== UI.tempLoginOtp){
          if(errEl) errEl.textContent="Incorrect OTP. Try again."; return;
        }
        // OTP verified - login successful
        UI.currentUserId = UI.tempLoginUserId;
        UI.authScreen = false;
        UI.otpSent = false;
        UI.otpVerifyMode = null;
        UI.tempLoginUserId = null;
        UI.tempLoginOtp = null;
        storageSet(USER_KEY, UI.currentUserId);
        if(UI.authReturnAction==="start-sell"){
          UI.authReturnAction=null; UI.tab="listings"; UI.listingFormOpen=true; UI.newListingCategory="";
        } else if(UI.authReturnTab){
          UI.tab=UI.authReturnTab; UI.authReturnTab=null;
        }
        render();
        return;
      } else if(UI.otpVerifyMode==="forgot-password"){
        if(otp !== UI.tempForgotOtp){
          if(errEl) errEl.textContent="Incorrect code. Try again."; return;
        }
        // OTP verified - allow password reset
        UI.authPage = "reset-password";
        UI.otpVerifyMode = null;
        if(errEl) errEl.textContent = "";
        render();
        return;
      }
    }
  }

  document.addEventListener("DOMContentLoaded", function(){
    // Profile picture upload (delegated — survives re-render)
    document.addEventListener("change", function(ev){
      if(!ev.target || ev.target.id !== "avatarFileInput") return;
      var aFile = (ev.target.files || [])[0];
      ev.target.value = "";
      if(!aFile) return;
      if(aFile.size && aFile.size > 5*1024*1024){ showToast("Profile picture must be under 5 MB."); return; }
      var aReader = new FileReader();
      aReader.onload = function(e){
        var au = currentUser();
        if(!au || !au.id){ showToast("Log in to set a profile picture."); return; }
        compressImage(e.target.result, 320, 0.8, function(small){
          au.avatarPhoto = small;
          saveDB();
          showToast("Profile picture updated.");
          render();
        });
      };
      aReader.onerror = function(){ showToast("Could not read that image."); };
      aReader.readAsDataURL(aFile);
    });
    // Show the "describe your item" box only when "Something else" is picked.
    // Toggled directly so anything already typed in the form is kept.
    document.addEventListener("change", function(ev){
      if(!ev.target || ev.target.id !== "offeredItemSelect") return;
      var wrap = document.getElementById("offerCustomWrap");
      var txt  = document.getElementById("offeredTextInput");
      var custom = ev.target.value === "__custom__";
      if(wrap) wrap.style.display = custom ? "" : "none";
      if(txt && custom){ try{ txt.focus(); }catch(e){} }
    });
    // Photos attached to a chat message (delegated — survives re-render)
    document.addEventListener("change", function(ev){
      if(!ev.target || ev.target.id !== "chatImgInput") return;
      var cFiles = Array.prototype.slice.call(ev.target.files || []);
      var cRemaining = Math.max(0, 4 - (UI.chatImages||[]).length);
      if(cFiles.length > cRemaining){
        showToast("You can attach up to 4 photos per message.");
      }
      cFiles = cFiles.slice(0, cRemaining);
      if(!cFiles.length){ ev.target.value = ""; return; }
      var cLoaded = 0;
      cFiles.forEach(function(file){
        if(file.size && file.size > 5*1024*1024){
          showToast("Photos must be under 5 MB.");
          cLoaded++;
          if(cLoaded===cFiles.length && !refreshChatImageStrip()) render();
          return;
        }
        var cReader = new FileReader();
        cReader.onload = function(e){
          compressImage(e.target.result, 1000, 0.72, function(small){
            UI.chatImages = (UI.chatImages || []).concat([small]);
            cLoaded++;
            if(cLoaded === cFiles.length && !refreshChatImageStrip()) render();
          });
        };
        cReader.onerror = function(){
          cLoaded++;
          showToast("Could not read that photo.");
          if(cLoaded === cFiles.length && !refreshChatImageStrip()) render();
        };
        cReader.readAsDataURL(file);
      });
      ev.target.value = "";
    });
    // FileReader for image previews (delegated — survives re-render)
    document.addEventListener("change", function(ev){
      if(ev.target && ev.target.id === "imgFileInput"){
        var files = Array.prototype.slice.call(ev.target.files || []);
        var remaining = Math.max(0, 5 - (UI.newListingImages||[]).length);
        files = files.slice(0, remaining);
        if(!files.length) return;
        var loaded = 0;
        files.forEach(function(file){
          var reader = new FileReader();
          reader.onload = function(ev0){
            compressImage(ev0.target.result, 1000, 0.72, function(small){
            UI.newListingImages = (UI.newListingImages || []).concat([small]);
            loaded++;
            if(loaded === files.length){
              // Update preview area without full re-render
              var prev = document.getElementById("imgPreviews");
              if(prev){
                prev.innerHTML = UI.newListingImages.map(function(src, i){
                  return '<div class="img-preview-wrap">' +
                    '<img src="'+src+'" alt="">' +
                    '<button type="button" class="img-remove-btn" data-imgidx="'+i+'" title="Remove">✕</button>' +
                  '</div>';
                }).join("");
              }
            }
            });
          };
          reader.readAsDataURL(file);
        });
      }
    });
    // Remove individual preview image
    document.addEventListener("click", function(ev){
      var btn = ev.target.closest ? ev.target.closest(".img-remove-btn") : null;
      if(!btn && ev.target && ev.target.classList && ev.target.classList.contains("img-remove-btn")) btn = ev.target;
      if(btn){
        var idx2 = parseInt(btn.getAttribute("data-imgidx"), 10);
        if(!isNaN(idx2)){
          UI.newListingImages = (UI.newListingImages||[]).filter(function(_,i){ return i!==idx2; });
          var prev = document.getElementById("imgPreviews");
          if(prev){
            prev.innerHTML = UI.newListingImages.map(function(src, i){
              return '<div class="img-preview-wrap">' +
                '<img src="'+src+'" alt="">' +
                '<button type="button" class="img-remove-btn" data-imgidx="'+i+'" title="Remove">✕</button>' +
              '</div>';
            }).join("");
          }
        }
      }
    });
    // No startup auth guard — guests land directly on the marketplace.
    // If a stored userId is stale (user deleted), just clear it silently.
    if(UI.currentUserId && !DB.users.find(function(u){ return u.id===UI.currentUserId; })){
      UI.currentUserId=""; storageRemove(USER_KEY);
    }
    var app = document.getElementById("app");
    app.addEventListener("click", onClick);
    app.addEventListener("change", onChange);
    app.addEventListener("input", onInput);
    app.addEventListener("submit", onSubmit, true);
    document.addEventListener("keydown", function(e){
      if(e.key==="Escape" && (UI.modal || UI.legalPage)){ UI.modal=null; UI.legalPage=null; render(); }
      if(e.key==="Enter" && e.target && e.target.id==="searchInput"){
        var q = e.target.value.trim();
        if(q){ addToRecentSearches(q); }
      }
    });

    // Location search
    document.addEventListener("input", function(ev){
      if(ev.target && ev.target.id === "navLocationInput"){
        var query = ev.target.value.toLowerCase();
        var dropdown = document.getElementById("locationDropdown");
        if(!dropdown) return;

        // Filter cities
        var filtered = CITIES.filter(function(c){
          return c.name.toLowerCase().indexOf(query) >= 0;
        });

        // Show dropdown with filtered cities
        if(query.length > 0 || filtered.length > 0){
          dropdown.style.display = "block";
          dropdown.innerHTML = filtered.map(function(c){
            return '<div style="padding:10px 12px;cursor:pointer;hover:background:var(--bg);" data-city="'+esc(c.name)+'">'+esc(c.name)+'</div>';
          }).join("");
        } else {
          dropdown.style.display = "none";
        }
      }
    });

    // City selection from dropdown
    document.addEventListener("click", function(ev){
      var cityItem = ev.target.closest ? ev.target.closest('[data-city]') : null;
      if(cityItem){
        var cityName = cityItem.getAttribute("data-city");
        var input = document.getElementById("navLocationInput");
        if(input){
          input.value = cityName;
          var dropdown = document.getElementById("locationDropdown");
          if(dropdown) dropdown.style.display = "none";
          // Update user location
          if(UI.currentUserId){
            var user = userById(UI.currentUserId);
            if(user){
              user.city = cityName;
              saveDB();
            }
          }
        }
      }
    });

    // Show dropdown on focus
    document.addEventListener("focus", function(ev){
      if(ev.target && ev.target.id === "navLocationInput"){
        var dropdown = document.getElementById("locationDropdown");
        if(dropdown && dropdown.innerHTML.length > 0){
          dropdown.style.display = "block";
        } else if(dropdown){
          // Show all cities on focus if empty
          dropdown.style.display = "block";
          dropdown.innerHTML = CITIES.map(function(c){
            return '<div style="padding:10px 12px;cursor:pointer;" data-city="'+esc(c.name)+'">'+esc(c.name)+'</div>';
          }).join("");
        }
      }
    }, true);

    // Typing indicator
    document.addEventListener("input", function(ev){
      if(ev.target && ev.target.getAttribute("data-dealid")){
        var dealId = ev.target.getAttribute("data-dealid");
        if(ev.target.value.length > 0){
          setUserTyping(dealId, true);
        } else {
          setUserTyping(dealId, false);
        }
      }
    });

    // Load saved searches for current user
    if(UI.currentUserId) loadUserSearches();

    render();

    // Pull the latest shared state once on load, then poll lightly so changes
    // made on other devices show up here too. Skipped while a modal/form is
    // open so it never clobbers something the user is actively typing.
    if(API_BASE){
      syncFromServer();
      setInterval(function(){
        if(UI.modal || UI.listingFormOpen) return;
        syncFromServer();
      }, 6000);
    }
  });
})();
</script>
</body>
</html>
